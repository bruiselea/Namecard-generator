<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名刺ジェネレーター</title>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  header {
    padding: 12px 20px;
    background: #111;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #fff; }
  header .spacer { flex: 1; }
  button.export-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button.export-btn:hover { background: #1d4ed8; }
  button.export-btn.green { background: #16a34a; }
  button.export-btn.green:hover { background: #15803d; }

  .main { display: flex; flex: 1; overflow: hidden; }

  .panel {
    width: 280px;
    background: #222;
    border-right: 1px solid #333;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .panel-section {
    padding: 14px 16px;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  .panel-section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 10px; }

  label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; margin-top: 10px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #444;
    color: #e0e0e0;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  input[type="color"] {
    width: 100%;
    height: 32px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    cursor: pointer;
    padding: 2px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .template-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .template-btn {
    background: #2a2a2a;
    border: 1px solid #444;
    color: #ddd;
    padding: 8px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .template-btn:hover { border-color: #666; background: #333; }

  /* フォントドロップゾーン */
  .font-drop {
    border: 1px dashed #555;
    border-radius: 4px;
    padding: 10px 12px;
    text-align: center;
    font-size: 12px;
    color: #888;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .font-drop:hover, .font-drop.dragover { border-color: #2563eb; background: #1a2a3a; color: #bbb; }
  .font-status { margin-top: 5px; font-size: 11px; color: #f59e0b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .font-status.loaded { color: #4ade80; }

  button.add-btn {
    width: 100%;
    background: #333;
    border: 1px dashed #555;
    color: #aaa;
    padding: 8px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
  }
  button.add-btn:hover { background: #3a3a3a; color: #fff; }

  .element-list { padding: 10px 16px; flex: 1; min-height: 0; }
  .element-list h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 10px; }
  .element-item {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .element-item:hover { border-color: #666; }
  .element-item.selected { border-color: #2563eb; background: #1e3a5f; }
  .element-item .color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid #666; }
  .element-item .elabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .element-item .del-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; padding: 0 2px; }
  .element-item .del-btn:hover { color: #e55; }

  .properties {
    padding: 14px 16px;
    border-top: 1px solid #333;
    background: #1e1e1e;
    flex-shrink: 0;
  }
  .properties-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .properties h2 { flex: 1; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; }
  .properties-close { background: none; border: none; color: #777; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .properties-close:hover { color: #eee; }
  .properties.hidden { display: none; }

  .canvas-area {
    flex: 1;
    background: pink;
    overflow: hidden;
    position: relative;
  }
  #namecard-canvas {
    position: absolute;
    cursor: default;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    transform-origin: 0 0;
  }
  .zoom-hint {
    position: absolute;
    bottom: 10px; right: 12px;
    font-size: 11px; color: #555;
    pointer-events: none;
    user-select: none;
  }

  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    background: #f59e0b22;
    color: #f59e0b;
    border: 1px solid #f59e0b44;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge.ok { background: #4ade8022; color: #4ade80; border-color: #4ade8044; }
</style>
</head>
<body>

<header>
  <h1>名刺ジェネレーター</h1>
  <span id="font-badge" class="badge">canvasモード（フォント不要）</span>
  <div class="spacer"></div>
  <button class="export-btn green" onclick="export3MF()">エクスポート</button>
</header>

<div class="main">
  <div class="panel">
    <!-- テンプレート -->
    <div class="panel-section">
      <h2>テンプレート</h2>
      <div class="template-grid">
        <button class="template-btn" onclick="applyTemplate('business')">ビジネス</button>
        <button class="template-btn" onclick="applyTemplate('qr-logo')">ロゴ + QR</button>
      </div>
    </div>

    <!-- フォント -->
    <div class="panel-section">
      <h2>フォント</h2>
      <div class="font-drop" id="font-drop" onclick="document.getElementById('font-file').click()">
        TTF / OTF をドロップ or クリック
        <div class="font-status" id="font-status">未読み込み（バウンディングボックス近似）</div>
      </div>
      <input type="file" id="font-file" accept=".ttf,.otf" style="display:none" onchange="onFontFileInput(this)">
    </div>

    <!-- カード設定 -->
    <div class="panel-section">
      <h2>カード設定</h2>
      <label>サイズ</label>
      <select id="card-size" onchange="onCardSizeChange()">
        <option value="91x55">標準 91×55mm</option>
        <option value="89x51">欧米 89×51mm</option>
        <option value="custom">カスタム</option>
      </select>
      <div id="custom-size" style="display:none">
        <div class="row2" style="margin-top:8px">
          <div><label>幅(mm)</label><input type="number" id="card-w" value="91" min="10" max="200" oninput="renderCanvas()"></div>
          <div><label>高さ(mm)</label><input type="number" id="card-h" value="55" min="10" max="200" oninput="renderCanvas()"></div>
        </div>
      </div>
      <label>ベースの厚み(mm)</label>
      <input type="number" id="base-thickness" value="0.8" min="0.2" max="5" step="0.1">
      <label>ベースの色</label>
      <input type="color" id="base-color" value="#ffffff" oninput="renderCanvas()">
    </div>

    <!-- 要素リスト -->
    <div class="element-list">
      <h2>要素</h2>
      <div id="element-list-container"></div>
      <button class="add-btn" onclick="addElement()">＋ テキストを追加</button>
      <button class="add-btn" onclick="addQRElement()">＋ QRを追加</button>
    </div>

    <!-- 選択要素プロパティ -->
    <div class="properties hidden" id="properties-panel">
      <div class="properties-header">
        <h2>プロパティ</h2>
        <button class="properties-close" onclick="closeProperties()" title="閉じる">×</button>
      </div>
      <label id="prop-text-label">テキスト</label>
      <input type="text" id="prop-text" oninput="updateSelectedProp('text', this.value)">
      <label id="prop-size-label">サイズ (pt)</label>
      <input type="number" id="prop-size" value="12" min="4" max="120" oninput="updateSelectedProp('size', +this.value)">
      <label id="prop-bold-label">スタイル</label>
      <select id="prop-bold" onchange="updateSelectedProp('bold', this.value === 'true')">
        <option value="true">太字</option>
        <option value="false">標準</option>
      </select>
      <label>色</label>
      <input type="color" id="prop-color" oninput="updateSelectedProp('color', this.value)">
      <label>押し出し高さ (mm)</label>
      <input type="number" id="prop-extrude" value="0.5" min="0.1" max="5" step="0.1" oninput="updateSelectedProp('extrude', +this.value)">
      <div class="row2" style="margin-top:10px">
        <div><label>X (mm)</label><input type="number" id="prop-x" step="0.5" oninput="updateSelectedProp('x', +this.value)"></div>
        <div><label>Y (mm)</label><input type="number" id="prop-y" step="0.5" oninput="updateSelectedProp('y', +this.value)"></div>
      </div>
    </div>
  </div>

  <!-- キャンバスエリア -->
  <div class="canvas-area" id="canvas-area">
    <canvas id="namecard-canvas"></canvas>
    <div class="zoom-hint">ホイール: ズーム　ドラッグ(空白): パン　ダブルクリック: リセット</div>
  </div>
</div>

<script>
// ============================================================
// 状態
// ============================================================
const PREVIEW_SCALE = 8; // CSS px / mm
let renderScale = PREVIEW_SCALE;
let cardW = 91, cardH = 55;
let selectedId = null;
let dragState = null;
let loadedFont = null;

// ビュー変換
let viewZoom = 1;
let viewPanX = 0, viewPanY = 0;
let panState  = null; // { startX, startY, startPanX, startPanY }

const canvasArea = document.getElementById('canvas-area');

function applyViewTransform() {
  canvas.style.transform = `translate(${viewPanX}px,${viewPanY}px) scale(${viewZoom})`;
}

function centerView() {
  const aw = canvasArea.clientWidth, ah = canvasArea.clientHeight;
  viewPanX = (aw - cardW * PREVIEW_SCALE * viewZoom) / 2;
  viewPanY = (ah - cardH * PREVIEW_SCALE * viewZoom) / 2;
  applyViewTransform();
}

// マウス座標 → カード内 mm 座標（ズーム・パン補正済み）
function clientToMM(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / (PREVIEW_SCALE * viewZoom),
    y: (clientY - rect.top)  / (PREVIEW_SCALE * viewZoom),
  };
}

let elements = [
  { id: uid(), type: 'text', text: '山田 太郎',           x: 8, y: 14, size: 18, bold: true, color: '#111111', extrude: 0.5 },
  { id: uid(), type: 'text', text: 'Taro Yamada',         x: 8, y: 21, size: 9,  bold: true, color: '#444444', extrude: 0.4 },
  { id: uid(), type: 'text', text: '株式会社サンプル',     x: 8, y: 31, size: 9,  bold: true, color: '#2563eb', extrude: 0.4 },
  { id: uid(), type: 'text', text: '090-0000-0000',       x: 8, y: 43, size: 7,  bold: true, color: '#555555', extrude: 0.3 },
  { id: uid(), type: 'text', text: 'sample@example.com', x: 8, y: 50, size: 7,  bold: true, color: '#555555', extrude: 0.3 },
];

function uid() { return Math.random().toString(36).slice(2); }

// ============================================================
// フォント読み込み
// ============================================================
async function onFontFileInput(input) {
  if (!input.files[0]) return;
  await loadFontFromFile(input.files[0]);
}

async function loadFontFromFile(file) {
  try {
    const buffer = await file.arrayBuffer();
    loadedFont = opentype.parse(buffer);
    const statusEl = document.getElementById('font-status');
    statusEl.textContent = file.name;
    statusEl.className = 'font-status loaded';
    const badge = document.getElementById('font-badge');
    badge.textContent = 'フォント読込済';
    badge.className = 'badge ok';
  } catch(e) {
    alert('フォントの読み込みに失敗しました: ' + e.message);
  }
}

const fontDrop = document.getElementById('font-drop');
fontDrop.addEventListener('dragover', e => { e.preventDefault(); fontDrop.classList.add('dragover'); });
fontDrop.addEventListener('dragleave', () => fontDrop.classList.remove('dragover'));
fontDrop.addEventListener('drop', async e => {
  e.preventDefault();
  fontDrop.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) await loadFontFromFile(file);
});

// ============================================================
// カードサイズ
// ============================================================
function onCardSizeChange() {
  const v = document.getElementById('card-size').value;
  const customDiv = document.getElementById('custom-size');
  if (v === 'custom') {
    customDiv.style.display = '';
  } else {
    customDiv.style.display = 'none';
    [cardW, cardH] = v.split('x').map(Number);
    document.getElementById('card-w').value = cardW;
    document.getElementById('card-h').value = cardH;
    renderCanvas();
  }
}

function applyTemplate(name) {
  selectedId = null;
  document.getElementById('properties-panel').classList.add('hidden');
  document.getElementById('base-color').value = '#ffffff';

  if (name === 'qr-logo') {
    elements = [
      { id: uid(), type: 'text', text: 'LOGO', x: 8, y: 25, size: 22, bold: true, color: '#111111', extrude: 0.6 },
      { id: uid(), type: 'qr', text: 'https://example.com', x: 56, y: 11, size: 33, bold: true, color: '#111111', extrude: 0.5 },
    ];
  } else {
    elements = [
      { id: uid(), type: 'text', text: '山田 太郎',           x: 8, y: 14, size: 18, bold: true, color: '#111111', extrude: 0.5 },
      { id: uid(), type: 'text', text: 'Taro Yamada',         x: 8, y: 21, size: 9,  bold: true, color: '#444444', extrude: 0.4 },
      { id: uid(), type: 'text', text: '株式会社サンプル',     x: 8, y: 31, size: 9,  bold: true, color: '#2563eb', extrude: 0.4 },
      { id: uid(), type: 'text', text: '090-0000-0000',       x: 8, y: 43, size: 7,  bold: true, color: '#555555', extrude: 0.3 },
      { id: uid(), type: 'text', text: 'sample@example.com', x: 8, y: 50, size: 7,  bold: true, color: '#555555', extrude: 0.3 },
    ];
  }

  renderElementList();
  renderCanvas(true);
}

// ============================================================
// 描画
// ============================================================
const canvas = document.getElementById('namecard-canvas');
const ctx = canvas.getContext('2d');

function renderCanvas(recenter = false) {
  cardW = +document.getElementById('card-w').value || 91;
  cardH = +document.getElementById('card-h').value || 55;
  const cssW = cardW * PREVIEW_SCALE;
  const cssH = cardH * PREVIEW_SCALE;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  renderScale = PREVIEW_SCALE * dpr;

  const pixelW = Math.round(cssW * dpr);
  const pixelH = Math.round(cssH * dpr);
  const prevW = canvas.width, prevH = canvas.height;
  canvas.width = pixelW;
  canvas.height = pixelH;
  canvas.style.width = `${cssW}px`;
  canvas.style.height = `${cssH}px`;
  if (recenter || prevW !== pixelW || prevH !== pixelH) centerView();

  ctx.fillStyle = document.getElementById('base-color').value;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const el of elements) {
    if (el.type === 'qr') {
      drawQRElement(ctx, el, renderScale);
    } else if (el.type === 'image') {
      drawImageElement(ctx, el, renderScale);
    } else {
      const px = el.size * renderScale * 0.353;
      ctx.font = `${el.bold ? 'bold ' : ''}${px}px system-ui, sans-serif`;
      ctx.fillStyle = el.color;
      ctx.fillText(el.text, el.x * renderScale, el.y * renderScale);
    }
  }

  if (selectedId) {
    const el = elements.find(e => e.id === selectedId);
    if (el) {
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 1.5 * dpr;
      ctx.setLineDash([4 * dpr, 3 * dpr]);
      if (el.type === 'qr' || el.type === 'image') {
        const h = getElementHeight(el);
        ctx.strokeRect(el.x * renderScale - 2 * dpr, el.y * renderScale - 2 * dpr, el.size * renderScale + 4 * dpr, h * renderScale + 4 * dpr);
      } else {
        const px = el.size * renderScale * 0.353;
        ctx.font = `${el.bold ? 'bold ' : ''}${px}px system-ui, sans-serif`;
        const w = ctx.measureText(el.text).width;
        ctx.strokeRect(el.x * renderScale - 2 * dpr, el.y * renderScale - px - 1 * dpr, w + 4 * dpr, px + 5 * dpr);
      }
      ctx.setLineDash([]);
    }
  }
}

function drawQRElement(targetCtx, el, scale) {
  const matrix = getQRMatrix(el.text);
  const count = matrix.length;
  if (!count) return;
  const module = el.size * scale / count;
  targetCtx.fillStyle = el.color;
  for (let y = 0; y < count; y++) {
    for (let x = 0; x < count; x++) {
      if (matrix[y][x]) targetCtx.fillRect(el.x * scale + x * module, el.y * scale + y * module, Math.ceil(module), Math.ceil(module));
    }
  }
}

function drawImageElement(targetCtx, el, scale) {
  if (!el.pixels || !el.gridW || !el.gridH) return;
  const cell = el.size * scale / el.gridW;
  for (const p of el.pixels) {
    targetCtx.fillStyle = p.color;
    targetCtx.fillRect(el.x * scale + p.x * cell, el.y * scale + p.y * cell, Math.ceil(cell), Math.ceil(cell));
  }
}

function getQRMatrix(text) {
  if (window.qrcode) {
    const qr = qrcode(0, 'M');
    qr.addData(text || ' ');
    qr.make();
    const count = qr.getModuleCount();
    return Array.from({ length: count }, (_, y) =>
      Array.from({ length: count }, (_, x) => qr.isDark(y, x))
    );
  }

  const count = 29;
  return Array.from({ length: count }, (_, y) =>
    Array.from({ length: count }, (_, x) => {
      const finder = (fx, fy) => x >= fx && x < fx + 7 && y >= fy && y < fy + 7 &&
        (x === fx || x === fx + 6 || y === fy || y === fy + 6 || (x >= fx + 2 && x <= fx + 4 && y >= fy + 2 && y <= fy + 4));
      if (finder(0, 0) || finder(count - 7, 0) || finder(0, count - 7)) return true;
      let h = 0;
      for (const ch of String(text || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return ((x * 17 + y * 23 + h) % 7) < 3;
    })
  );
}

function getElementHeight(el) {
  if (el.type === 'image' && el.gridW && el.gridH) return el.size * el.gridH / el.gridW;
  return el.size;
}

async function svgFileToLogoElement(file) {
  const svgText = await file.text();
  const parsed = parseSvgLogo(svgText);
  const pixels = [];
  for (const color of parsed.colors) {
    pixels.push(...await rasterizeSvgColorLayer(parsed.doc, parsed.viewBox, color, parsed.gridW, parsed.gridH));
  }
  const vectorGroups = extractSvgVectorGroups(parsed.doc, parsed.viewBox);
  return {
    id: uid(),
    type: 'image',
    text: file.name.replace(/\.[^.]+$/, '') || 'logo',
    x: 8,
    y: 10,
    size: 32,
    gridW: parsed.gridW,
    gridH: parsed.gridH,
    pixels,
    vectorGroups,
    viewBox: parsed.viewBox,
    bold: true,
    color: pixels[0]?.color || '#111111',
    extrude: 0.5,
  };
}

function parseSvgLogo(svgText) {
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  const root = doc.documentElement;
  if (!root || root.nodeName.toLowerCase() === 'parsererror') throw new Error('SVGとして解析できませんでした');
  if (!root.getAttribute('xmlns')) root.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

  const viewBox = getSvgViewBox(root);
  const targetCells = 180;
  const scale = targetCells / Math.max(viewBox.w, viewBox.h);
  const gridW = Math.max(1, Math.round(viewBox.w * scale));
  const gridH = Math.max(1, Math.round(viewBox.h * scale));
  const colors = collectSvgColors(root);
  if (colors.length === 0) colors.push('#111111');
  return { doc, viewBox, gridW, gridH, colors: colors.slice(0, 8) };
}

function getSvgViewBox(root) {
  const vb = (root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  if (vb.length === 4 && vb.every(Number.isFinite) && vb[2] > 0 && vb[3] > 0) {
    return { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };
  }
  const w = parseSvgLength(root.getAttribute('width')) || 100;
  const h = parseSvgLength(root.getAttribute('height')) || 100;
  root.setAttribute('viewBox', `0 0 ${w} ${h}`);
  return { x: 0, y: 0, w, h };
}

function parseSvgLength(value) {
  const n = parseFloat(String(value || '').replace(/[a-z%]+$/i, ''));
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function collectSvgColors(root) {
  const counts = new Map();
  for (const el of svgPaintElements(root)) {
    for (const prop of ['fill', 'stroke']) {
      const color = normalizeSvgColor(getInheritedSvgPaint(el, prop));
      if (!color) continue;
      counts.set(color, (counts.get(color) || 0) + 1);
    }
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([color]) => color);
}

function svgPaintElements(root) {
  return [...root.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line')];
}

function getInheritedSvgPaint(el, prop) {
  for (let node = el; node && node.nodeType === 1; node = node.parentNode) {
    const stylePaint = getStylePaint(node.getAttribute('style'), prop);
    if (stylePaint) return stylePaint;
    const attrPaint = node.getAttribute(prop);
    if (attrPaint) return attrPaint;
  }
  return prop === 'fill' ? '#000000' : 'none';
}

function getStylePaint(style, prop) {
  const m = String(style || '').match(new RegExp(`${prop}\\s*:\\s*([^;]+)`, 'i'));
  return m ? m[1].trim() : '';
}

function normalizeSvgColor(value) {
  const raw = String(value || '').trim();
  if (!raw || raw === 'none' || raw === 'transparent' || raw === 'currentColor' || raw.startsWith('url(')) return '';
  const c = document.createElement('canvas').getContext('2d');
  c.fillStyle = '#000000';
  c.fillStyle = raw;
  const normalized = c.fillStyle;
  if (/^#[0-9a-f]{6}$/i.test(normalized)) return normalized.toUpperCase();
  const m = normalized.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
  if (!m) return '';
  return '#' + [m[1], m[2], m[3]].map(n => Number(n).toString(16).padStart(2, '0')).join('').toUpperCase();
}

async function rasterizeSvgColorLayer(doc, viewBox, color, gridW, gridH) {
  const clone = doc.documentElement.cloneNode(true);
  clone.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
  clone.setAttribute('width', String(gridW));
  clone.setAttribute('height', String(gridH));

  for (const el of svgPaintElements(clone)) {
    const fill = normalizeSvgColor(getInheritedSvgPaint(el, 'fill'));
    const stroke = normalizeSvgColor(getInheritedSvgPaint(el, 'stroke'));
    const nextFill = fill === color ? color : 'none';
    const nextStroke = stroke === color ? color : 'none';
    el.setAttribute('fill', nextFill);
    el.setAttribute('stroke', nextStroke);
    el.setAttribute('style', `${el.getAttribute('style') || ''};fill:${nextFill};stroke:${nextStroke};`);
  }

  const svg = new XMLSerializer().serializeToString(clone);
  const img = await loadSvgImage(svg);
  const tmp = document.createElement('canvas');
  tmp.width = gridW; tmp.height = gridH;
  const tc = tmp.getContext('2d');
  tc.drawImage(img, 0, 0, gridW, gridH);
  const data = tc.getImageData(0, 0, gridW, gridH).data;
  const pixels = [];
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      if (data[(y * gridW + x) * 4 + 3] > 96) pixels.push({ x, y, color });
    }
  }
  return pixels;
}

function loadSvgImage(svg) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('SVGを画像化できませんでした')); };
    img.src = url;
  });
}

function extractSvgVectorGroups(doc, viewBox) {
  const byColor = new Map();
  for (const el of svgPaintElements(doc.documentElement)) {
    const color = normalizeSvgColor(getInheritedSvgPaint(el, 'fill'));
    if (!color) continue;
    const matrix = getCumulativeSvgTransform(el);
    const contours = svgElementToContours(el).map(contour => contour.map(p => applySvgMatrix(p, matrix)));
    if (!contours.length) continue;
    if (!byColor.has(color)) byColor.set(color, []);
    byColor.get(color).push(...contours);
  }
  return [...byColor.entries()].map(([color, contours]) => ({ color, contours, viewBox }));
}

function svgElementToContours(el) {
  const tag = el.tagName.toLowerCase();
  if (tag === 'path') return parseSvgPathContours(el.getAttribute('d') || '');
  if (tag === 'rect') {
    const x = parseSvgLength(el.getAttribute('x'));
    const y = parseSvgLength(el.getAttribute('y'));
    const w = parseSvgLength(el.getAttribute('width'));
    const h = parseSvgLength(el.getAttribute('height'));
    return w > 0 && h > 0 ? [[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]] : [];
  }
  if (tag === 'circle' || tag === 'ellipse') {
    const cx = parseSvgLength(el.getAttribute('cx'));
    const cy = parseSvgLength(el.getAttribute('cy'));
    const rx = tag === 'circle' ? parseSvgLength(el.getAttribute('r')) : parseSvgLength(el.getAttribute('rx'));
    const ry = tag === 'circle' ? rx : parseSvgLength(el.getAttribute('ry'));
    return rx > 0 && ry > 0 ? [ellipseContour(cx, cy, rx, ry, 48)] : [];
  }
  if (tag === 'polygon' || tag === 'polyline') {
    const pts = parseSvgPoints(el.getAttribute('points') || '');
    return pts.length >= 3 ? [pts] : [];
  }
  if (tag === 'line') {
    return [];
  }
  return [];
}

function ellipseContour(cx, cy, rx, ry, steps) {
  const pts = [];
  for (let i = 0; i < steps; i++) {
    const a = Math.PI * 2 * i / steps;
    pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return pts;
}

function parseSvgPoints(points) {
  const nums = points.trim().split(/[\s,]+/).map(Number).filter(Number.isFinite);
  const pts = [];
  for (let i = 0; i + 1 < nums.length; i += 2) pts.push([nums[i], nums[i + 1]]);
  return pts;
}

function getCumulativeSvgTransform(el) {
  let m = [1, 0, 0, 1, 0, 0];
  const chain = [];
  for (let node = el; node && node.nodeType === 1; node = node.parentNode) chain.unshift(node);
  for (const node of chain) m = multiplySvgMatrix(m, parseSvgTransform(node.getAttribute('transform')));
  return m;
}

function parseSvgTransform(value) {
  let m = [1, 0, 0, 1, 0, 0];
  const re = /(matrix|translate|scale)\(([^)]+)\)/g;
  let match;
  while ((match = re.exec(String(value || '')))) {
    const nums = match[2].trim().split(/[\s,]+/).map(Number).filter(Number.isFinite);
    let t = [1, 0, 0, 1, 0, 0];
    if (match[1] === 'matrix' && nums.length >= 6) t = nums.slice(0, 6);
    if (match[1] === 'translate') t = [1, 0, 0, 1, nums[0] || 0, nums[1] || 0];
    if (match[1] === 'scale') t = [nums[0] || 1, 0, 0, nums.length > 1 ? nums[1] : nums[0] || 1, 0, 0];
    m = multiplySvgMatrix(m, t);
  }
  return m;
}

function multiplySvgMatrix(a, b) {
  return [
    a[0] * b[0] + a[2] * b[1],
    a[1] * b[0] + a[3] * b[1],
    a[0] * b[2] + a[2] * b[3],
    a[1] * b[2] + a[3] * b[3],
    a[0] * b[4] + a[2] * b[5] + a[4],
    a[1] * b[4] + a[3] * b[5] + a[5],
  ];
}

function applySvgMatrix(p, m) {
  return [p[0] * m[0] + p[1] * m[2] + m[4], p[0] * m[1] + p[1] * m[3] + m[5]];
}

function parseSvgPathContours(d) {
  const tokens = [...d.matchAll(/[a-zA-Z]|[-+]?(?:\d*\.\d+|\d+)(?:e[-+]?\d+)?/g)].map(m => m[0]);
  const contours = [];
  let i = 0, cmd = '', cur = [0, 0], start = [0, 0], contour = null, lastC = null, lastQ = null;
  const isCmd = t => /^[a-zA-Z]$/.test(t);
  const num = () => Number(tokens[i++]);
  const hasNums = () => i < tokens.length && !isCmd(tokens[i]);
  const add = p => { if (!contour) contour = []; contour.push(p); cur = p; };
  const close = () => { if (contour && contour.length >= 3) contours.push(contour); contour = null; cur = start; };

  while (i < tokens.length) {
    if (isCmd(tokens[i])) cmd = tokens[i++];
    const rel = cmd === cmd.toLowerCase();
    const C = cmd.toUpperCase();
    if (C === 'M') {
      const p = [num(), num()];
      const q = rel ? [cur[0] + p[0], cur[1] + p[1]] : p;
      if (contour && contour.length >= 3) contours.push(contour);
      contour = [q]; cur = q; start = q; lastC = null; lastQ = null;
      while (hasNums()) {
        const lp = [num(), num()];
        add(rel ? [cur[0] + lp[0], cur[1] + lp[1]] : lp);
      }
    } else if (C === 'L') {
      while (hasNums()) {
        const p = [num(), num()];
        add(rel ? [cur[0] + p[0], cur[1] + p[1]] : p); lastC = null; lastQ = null;
      }
    } else if (C === 'H') {
      while (hasNums()) {
        const x = num();
        add([rel ? cur[0] + x : x, cur[1]]); lastC = null; lastQ = null;
      }
    } else if (C === 'V') {
      while (hasNums()) {
        const y = num();
        add([cur[0], rel ? cur[1] + y : y]); lastC = null; lastQ = null;
      }
    } else if (C === 'C') {
      while (hasNums()) {
        const p1 = [num(), num()], p2 = [num(), num()], p = [num(), num()];
        const q1 = rel ? [cur[0]+p1[0], cur[1]+p1[1]] : p1;
        const q2 = rel ? [cur[0]+p2[0], cur[1]+p2[1]] : p2;
        const q = rel ? [cur[0]+p[0], cur[1]+p[1]] : p;
        cubicBezier(cur, q1, q2, q, 24).slice(1).forEach(add);
        lastC = q2; lastQ = null;
      }
    } else if (C === 'S') {
      while (hasNums()) {
        const p2 = [num(), num()], p = [num(), num()];
        const q1 = lastC ? [cur[0] * 2 - lastC[0], cur[1] * 2 - lastC[1]] : cur;
        const q2 = rel ? [cur[0]+p2[0], cur[1]+p2[1]] : p2;
        const q = rel ? [cur[0]+p[0], cur[1]+p[1]] : p;
        cubicBezier(cur, q1, q2, q, 24).slice(1).forEach(add);
        lastC = q2; lastQ = null;
      }
    } else if (C === 'Q') {
      while (hasNums()) {
        const p1 = [num(), num()], p = [num(), num()];
        const q1 = rel ? [cur[0]+p1[0], cur[1]+p1[1]] : p1;
        const q = rel ? [cur[0]+p[0], cur[1]+p[1]] : p;
        quadBezier(cur, q1, q, 18).slice(1).forEach(add);
        lastQ = q1; lastC = null;
      }
    } else if (C === 'T') {
      while (hasNums()) {
        const p = [num(), num()];
        const q1 = lastQ ? [cur[0] * 2 - lastQ[0], cur[1] * 2 - lastQ[1]] : cur;
        const q = rel ? [cur[0]+p[0], cur[1]+p[1]] : p;
        quadBezier(cur, q1, q, 18).slice(1).forEach(add);
        lastQ = q1; lastC = null;
      }
    } else if (C === 'A') {
      while (hasNums()) {
        num(); num(); num(); num(); num();
        const p = [num(), num()];
        add(rel ? [cur[0] + p[0], cur[1] + p[1]] : p);
        lastC = null; lastQ = null;
      }
    } else if (C === 'Z') {
      close();
    } else {
      while (hasNums()) i++;
    }
  }
  if (contour && contour.length >= 3) contours.push(contour);
  return contours;
}

// ============================================================
// 要素リスト UI
// ============================================================
function renderElementList() {
  const container = document.getElementById('element-list-container');
  container.innerHTML = '';
  for (const el of elements) {
    const item = document.createElement('div');
    item.className = 'element-item' + (el.id === selectedId ? ' selected' : '');
    const label = el.type === 'qr' ? `QR: ${el.text}` : el.type === 'image' ? `ロゴ: ${el.text}` : el.text;
    item.innerHTML = `
      <span class="color-dot" style="background:${el.color}"></span>
      <span class="elabel">${escHtml(label)}</span>
      <button class="del-btn" data-id="${el.id}">✕</button>
    `;
    item.querySelector('.del-btn').addEventListener('click', e => { e.stopPropagation(); deleteElement(el.id); });
    item.addEventListener('click', () => selectElement(el.id));
    container.appendChild(item);
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// 選択・プロパティ
// ============================================================
function selectElement(id) {
  selectedId = id;
  const el = elements.find(e => e.id === id);
  const panel = document.getElementById('properties-panel');
  if (el) {
    panel.classList.remove('hidden');
    const isQR = el.type === 'qr';
    const isImage = el.type === 'image';
    document.getElementById('prop-text-label').textContent = isQR ? 'QR内容' : isImage ? '名前' : 'テキスト';
    document.getElementById('prop-size-label').textContent = (isQR || isImage) ? 'サイズ (mm)' : 'サイズ (pt)';
    document.getElementById('prop-bold-label').style.display = (isQR || isImage) ? 'none' : '';
    document.getElementById('prop-bold').style.display = (isQR || isImage) ? 'none' : '';
    document.getElementById('prop-text').value    = el.text;
    document.getElementById('prop-size').value    = el.size;
    document.getElementById('prop-bold').value    = String(el.bold);
    document.getElementById('prop-color').value   = el.color;
    document.getElementById('prop-extrude').value = el.extrude;
    document.getElementById('prop-x').value       = el.x;
    document.getElementById('prop-y').value       = el.y;
  } else {
    panel.classList.add('hidden');
  }
  renderElementList();
  renderCanvas();
}

function updateSelectedProp(key, value) {
  const el = elements.find(e => e.id === selectedId);
  if (!el) return;
  el[key] = value;
  if (key === 'x') document.getElementById('prop-x').value = value;
  if (key === 'y') document.getElementById('prop-y').value = value;
  renderElementList();
  renderCanvas();
}

function closeProperties() {
  selectedId = null;
  document.getElementById('properties-panel').classList.add('hidden');
  renderElementList();
  renderCanvas();
}

function addElement() {
  const el = { id: uid(), type: 'text', text: '新しいテキスト', x: 10, y: 20, size: 10, bold: true, color: '#000000', extrude: 0.4 };
  elements.push(el);
  selectElement(el.id);
}

function addQRElement() {
  const el = { id: uid(), type: 'qr', text: 'https://example.com', x: 55, y: 12, size: 28, bold: true, color: '#000000', extrude: 0.5 };
  elements.push(el);
  selectElement(el.id);
}

async function onLogoFileInput(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!/\.svg$/i.test(file.name) && file.type !== 'image/svg+xml') {
    alert('ロゴはSVGファイルを選択してください。');
    input.value = '';
    return;
  }
  try {
    const el = await svgFileToLogoElement(file);
    elements.push(el);
    input.value = '';
    selectElement(el.id);
  } catch(e) {
    alert('SVGロゴの読み込みに失敗しました: ' + e.message);
    console.error(e);
  }
}

function deleteElement(id) {
  elements = elements.filter(el => el.id !== id);
  if (selectedId === id) {
    selectedId = null;
    document.getElementById('properties-panel').classList.add('hidden');
  }
  renderElementList();
  renderCanvas();
}

// ============================================================
// 要素ドラッグ & ビューパン
// ============================================================
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const { x: mx, y: my } = clientToMM(e.clientX, e.clientY);

  let hit = null;
  for (let i = elements.length - 1; i >= 0; i--) {
    const el = elements[i];
    let inside;
    if (el.type === 'qr' || el.type === 'image') {
      inside = mx >= el.x - 1 && mx <= el.x + el.size + 1 && my >= el.y - 1 && my <= el.y + getElementHeight(el) + 1;
    } else {
      const px = el.size * renderScale * 0.353;
      ctx.font = `${el.bold ? 'bold ' : ''}${px}px system-ui, sans-serif`;
      const w = ctx.measureText(el.text).width / renderScale;
      const h = el.size * 0.353;
      inside = mx >= el.x - 1 && mx <= el.x + w + 1 && my >= el.y - h - 1 && my <= el.y + 2;
    }
    if (inside) {
      hit = el; break;
    }
  }

  if (hit) {
    selectElement(hit.id);
    dragState = { id: hit.id, startMX: mx, startMY: my, startX: hit.x, startY: hit.y };
    canvas.style.cursor = 'grabbing';
  } else {
    // 空白クリック → パン開始（mouseup で移動量が少なければ deselect）
    panState = { startX: e.clientX, startY: e.clientY, startPanX: viewPanX, startPanY: viewPanY, moved: false };
    canvas.style.cursor = 'grab';
  }
});

window.addEventListener('mousemove', e => {
  if (dragState) {
    const { x: mx, y: my } = clientToMM(e.clientX, e.clientY);
    const el = elements.find(el => el.id === dragState.id);
    if (el) {
      el.x = Math.round((dragState.startX + mx - dragState.startMX) * 10) / 10;
      el.y = Math.round((dragState.startY + my - dragState.startMY) * 10) / 10;
      document.getElementById('prop-x').value = el.x;
      document.getElementById('prop-y').value = el.y;
      renderCanvas();
    }
  } else if (panState) {
    const dx = e.clientX - panState.startX;
    const dy = e.clientY - panState.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panState.moved = true;
    viewPanX = panState.startPanX + dx;
    viewPanY = panState.startPanY + dy;
    applyViewTransform();
  }
});

window.addEventListener('mouseup', e => {
  if (dragState) {
    dragState = null;
    canvas.style.cursor = 'default';
  } else if (panState) {
    if (!panState.moved) {
      // 移動なし → deselect
      selectedId = null;
      document.getElementById('properties-panel').classList.add('hidden');
      renderElementList();
      renderCanvas();
    }
    panState = null;
    canvas.style.cursor = 'default';
  }
});

// ホイール: ズーム（マウス位置固定）
canvasArea.addEventListener('wheel', e => {
  e.preventDefault();
  const areaRect = canvasArea.getBoundingClientRect();
  const mx = e.clientX - areaRect.left; // canvasArea内のCSS px
  const my = e.clientY - areaRect.top;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const newZoom = Math.max(0.2, Math.min(10, viewZoom * factor));
  viewPanX = mx - (mx - viewPanX) * newZoom / viewZoom;
  viewPanY = my - (my - viewPanY) * newZoom / viewZoom;
  viewZoom = newZoom;
  applyViewTransform();
}, { passive: false });

// ダブルクリック: ビューリセット
canvasArea.addEventListener('dblclick', e => {
  viewZoom = 1;
  centerView();
});

// ============================================================
// ジオメトリ：ボックス
// ============================================================
function boxTriangles(x, y, z, w, h, d) {
  const v = [
    [x,   y,   z],   [x+w, y,   z],   [x+w, y+h, z],   [x,   y+h, z],
    [x,   y,   z+d], [x+w, y,   z+d], [x+w, y+h, z+d], [x,   y+h, z+d],
  ];
  return [
    [v[0],v[3],v[2]], [v[0],v[2],v[1]], // bottom
    [v[4],v[5],v[6]], [v[4],v[6],v[7]], // top
    [v[0],v[1],v[5]], [v[0],v[5],v[4]], // front
    [v[2],v[3],v[7]], [v[2],v[7],v[6]], // back
    [v[1],v[2],v[6]], [v[1],v[6],v[5]], // right
    [v[3],v[0],v[4]], [v[3],v[4],v[7]], // left
  ];
}

// ============================================================
// ジオメトリ：フォントパス → 押し出しメッシュ
// ============================================================
function cubicBezier(p0, p1, p2, p3, steps = 24) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, mt = 1 - t;
    pts.push([
      mt*mt*mt*p0[0] + 3*mt*mt*t*p1[0] + 3*mt*t*t*p2[0] + t*t*t*p3[0],
      mt*mt*mt*p0[1] + 3*mt*mt*t*p1[1] + 3*mt*t*t*p2[1] + t*t*t*p3[1],
    ]);
  }
  return pts;
}

function quadBezier(p0, p1, p2, steps = 18) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, mt = 1 - t;
    pts.push([
      mt*mt*p0[0] + 2*mt*t*p1[0] + t*t*p2[0],
      mt*mt*p0[1] + 2*mt*t*p1[1] + t*t*p2[1],
    ]);
  }
  return pts;
}

function pathToContours(commands) {
  const contours = [];
  let cur = null;
  for (const cmd of commands) {
    switch (cmd.type) {
      case 'M':
        if (cur && cur.length >= 3) contours.push(cur);
        cur = [[cmd.x, cmd.y]];
        break;
      case 'L':
        cur && cur.push([cmd.x, cmd.y]);
        break;
      case 'C': {
        if (!cur || cur.length === 0) break;
        const p0 = cur[cur.length - 1];
        cubicBezier(p0, [cmd.x1,cmd.y1], [cmd.x2,cmd.y2], [cmd.x,cmd.y]).slice(1).forEach(p => cur.push(p));
        break;
      }
      case 'Q': {
        if (!cur || cur.length === 0) break;
        const p0 = cur[cur.length - 1];
        quadBezier(p0, [cmd.x1,cmd.y1], [cmd.x,cmd.y]).slice(1).forEach(p => cur.push(p));
        break;
      }
      case 'Z':
        if (cur && cur.length >= 3) contours.push(cur);
        cur = null;
        break;
    }
  }
  if (cur && cur.length >= 3) contours.push(cur);
  return contours;
}

function signedArea(c) {
  let a = 0;
  for (let i = 0, n = c.length; i < n; i++) {
    const j = (i + 1) % n;
    a += c[i][0] * c[j][1] - c[j][0] * c[i][1];
  }
  return a / 2;
}

function contourInteriorPoint(c) {
  let cx = 0, cy = 0, crossSum = 0;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (let i = 0, n = c.length; i < n; i++) {
    const p = c[i], q = c[(i + 1) % n];
    const cross = p[0] * q[1] - q[0] * p[1];
    crossSum += cross;
    cx += (p[0] + q[0]) * cross;
    cy += (p[1] + q[1]) * cross;
    minX = Math.min(minX, p[0]); minY = Math.min(minY, p[1]);
    maxX = Math.max(maxX, p[0]); maxY = Math.max(maxY, p[1]);
  }

  if (Math.abs(crossSum) > 1e-9) {
    const p = [cx / (3 * crossSum), cy / (3 * crossSum)];
    if (pointInPolygon(p[0], p[1], c)) return p;
  }

  const mid = [(minX + maxX) / 2, (minY + maxY) / 2];
  if (pointInPolygon(mid[0], mid[1], c)) return mid;

  for (let gy = 1; gy <= 7; gy++) {
    for (let gx = 1; gx <= 7; gx++) {
      const p = [minX + (maxX - minX) * gx / 8, minY + (maxY - minY) * gy / 8];
      if (pointInPolygon(p[0], p[1], c)) return p;
    }
  }

  let x = 0, y = 0;
  for (const p of c) { x += p[0]; y += p[1]; }
  return [x / c.length, y / c.length];
}

function pointInPolygon(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function organizeContours(contours) {
  const items = contours
    .filter(c => c.length >= 3)
    .map(c => ({ c, area: Math.abs(signedArea(c)), point: contourInteriorPoint(c) }))
    .filter(item => item.area > 1e-6)
    .sort((a, b) => b.area - a.area);

  const groups = [];

  for (let i = 0; i < items.length; i++) {
    const [cx, cy] = items[i].point;
    let depth = 0;
    for (let j = 0; j < items.length; j++) {
      if (i !== j && items[j].area > items[i].area && pointInPolygon(cx, cy, items[j].c)) depth++;
    }
    items[i].depth = depth;
    items[i].filled = depth % 2 === 0;
  }

  for (let i = 0; i < items.length; i++) {
    if (!items[i].filled) continue;
    const holes = [];

    for (let j = 0; j < items.length; j++) {
      if (items[j].filled || items[j].area >= items[i].area) continue;
      const [hx, hy] = items[j].point;
      if (!pointInPolygon(hx, hy, items[i].c)) continue;

      let nearestFilledParent = null;
      for (let k = 0; k < items.length; k++) {
        if (!items[k].filled || items[k].area <= items[j].area || items[k].area >= items[i].area) continue;
        if (pointInPolygon(hx, hy, items[k].c) && (!nearestFilledParent || items[k].area < nearestFilledParent.area)) {
          nearestFilledParent = items[k];
        }
      }
      if (!nearestFilledParent) holes.push(items[j].c);
    }

    groups.push({ outer: items[i].c, holes });
  }
  return groups;
}

function extrudeContourGroup(outer, holes, z0, height) {
  // earcut用巻き方向正規化（canvas Y下増加系: outer=正面積/CW、hole=負面積/CCW）
  if (signedArea(outer) < 0) outer = outer.slice().reverse();
  holes = holes.map(h => signedArea(h) > 0 ? h.slice().reverse() : h);

  const tris = [];
  const z1 = z0 + height;

  const flat = [];
  const holeIdx = [];
  for (const p of outer) flat.push(p[0], p[1]);
  for (const h of holes) {
    holeIdx.push(flat.length / 2);
    for (const p of h) flat.push(p[0], p[1]);
  }

  const pts = [];
  for (let i = 0; i < flat.length; i += 2) pts.push([flat[i], flat[i+1]]);

  let idx;
  try { idx = earcut(flat, holeIdx.length ? holeIdx : null, 2); }
  catch(e) { return tris; }

  // 上面・下面
  for (let i = 0; i < idx.length; i += 3) {
    const [a, b, c] = [pts[idx[i]], pts[idx[i+1]], pts[idx[i+2]]];
    tris.push([[a[0],a[1],z1],[b[0],b[1],z1],[c[0],c[1],z1]]); // top
    tris.push([[c[0],c[1],z0],[b[0],b[1],z0],[a[0],a[1],z0]]); // bottom
  }

  // 側面
  const addWalls = (contour, flip) => {
    for (let i = 0, n = contour.length; i < n; i++) {
      const a = contour[i], b = contour[(i+1)%n];
      if (!flip) {
        tris.push([[a[0],a[1],z0],[b[0],b[1],z0],[b[0],b[1],z1]]);
        tris.push([[a[0],a[1],z0],[b[0],b[1],z1],[a[0],a[1],z1]]);
      } else {
        tris.push([[b[0],b[1],z0],[a[0],a[1],z0],[a[0],a[1],z1]]);
        tris.push([[b[0],b[1],z0],[a[0],a[1],z1],[b[0],b[1],z1]]);
      }
    }
  };
  addWalls(outer, false);
  for (const h of holes) addWalls(h, true);

  return tris;
}

// canvas Y（下増加）→ 3D Y（上増加）に変換し、法線の向きも補正
function flipY(tris) {
  return tris.map(([a, b, c]) => [
    [a[0], cardH - a[1], a[2]],
    [c[0], cardH - c[1], c[2]], // b↔c 入替で法線反転を補正
    [b[0], cardH - b[1], b[2]],
  ]);
}

function textToTriangles(el, baseZ) {
  if (el.type === 'qr') return qrToTriangles(el, baseZ);
  if (el.type === 'image') return imageToTriangles(el, baseZ);
  if (loadedFont) return textToTrianglesFont(el, baseZ);
  return textToTrianglesCanvas(el, baseZ);
}

function qrToTriangles(el, baseZ) {
  const matrix = getQRMatrix(el.text);
  const count = matrix.length;
  if (!count) return [];
  const module = el.size / count;
  const tris = [];
  for (let y = 0; y < count; y++) {
    for (let x = 0; x < count; x++) {
      if (!matrix[y][x]) continue;
      tris.push(...boxTriangles(el.x + x * module, el.y + y * module, baseZ, module, module, el.extrude));
    }
  }
  return flipY(tris);
}

function imageToTriangles(el, baseZ, colorFilter = null) {
  if (el.vectorGroups && el.vectorGroups.length) {
    const groups = colorFilter ? el.vectorGroups.filter(g => g.color === colorFilter) : el.vectorGroups;
    return flipY(groups.flatMap(group => svgVectorGroupToTriangles(el, group, baseZ)));
  }
  if (!el.pixels || !el.gridW || !el.gridH) return [];
  const pix = new Uint8Array(el.gridW * el.gridH);
  for (const p of el.pixels) {
    if (colorFilter && p.color !== colorFilter) continue;
    pix[p.y * el.gridW + p.x] = 1;
  }
  const mask = {
    pix,
    W: el.gridW,
    H: el.gridH,
    ox: el.x,
    oy: el.y,
    pxPerMM: el.gridW / el.size,
  };
  const tris = rasterMaskToWatertightTriangles(mask, baseZ, el.extrude);
  return flipY(tris);
}

function svgVectorGroupToTriangles(el, group, baseZ) {
  const vb = group.viewBox || el.viewBox;
  if (!vb || !vb.w || !vb.h) return [];
  const scale = el.size / vb.w;
  const contours = group.contours.map(contour =>
    contour.map(([x, y]) => [
      el.x + (x - vb.x) * scale,
      el.y + (y - vb.y) * scale,
    ])
  ).filter(c => c.length >= 3 && Math.abs(signedArea(c)) > 0.0001);
  const groups = organizeContours(contours);
  return groups.flatMap(({ outer, holes }) => extrudeContourGroup(outer, holes, baseZ, el.extrude));
}

// opentype.js フォントアウトラインを押し出し
function textToTrianglesFont(el, baseZ) {
  try {
    const mask = makeTextRasterMask(el, true, 24);
    const tris = rasterMaskToWatertightTriangles(mask, baseZ, el.extrude);
    if (tris.length === 0) return textToTrianglesCanvas(el, baseZ);
    return flipY(tris);
  } catch(e) {
    console.warn('font voxel geometry failed, falling back to canvas:', e);
    return textToTrianglesCanvas(el, baseZ);
  }
}

// canvas ピクセル → ボクセル化（フォントファイル不要・日本語対応）
// canvas モード：塗られているピクセルから直接 watertight メッシュを作る
function textToTrianglesCanvas(el, baseZ) {
  const mask = makeTextRasterMask(el, false, 24);
  return flipY(rasterMaskToWatertightTriangles(mask, baseZ, el.extrude));
}

function makeTextRasterMask(el, useLoadedFont = !!loadedFont, pxPerMM = 80) {
  const fontSizeMM = el.size * 0.353;
  const fontPx    = fontSizeMM * pxPerMM;

  const tmp = document.createElement('canvas');
  const tc  = tmp.getContext('2d');
  const padMM = Math.max(0.8, fontSizeMM * 0.2);
  let ox, oy, W, H;

  if (useLoadedFont && loadedFont) {
    const path = loadedFont.getPath(el.text, el.x, el.y, fontSizeMM);
    const box = path.getBoundingBox();
    if (![box.x1, box.y1, box.x2, box.y2].every(Number.isFinite)) return emptyRasterMask(pxPerMM);
    ox = box.x1 - padMM;
    oy = box.y1 - padMM;
    W = Math.max(8, Math.ceil((box.x2 - box.x1 + padMM * 2) * pxPerMM));
    H = Math.max(8, Math.ceil((box.y2 - box.y1 + padMM * 2) * pxPerMM));
    tmp.width = W; tmp.height = H;

    tc.setTransform(pxPerMM, 0, 0, pxPerMM, -ox * pxPerMM, -oy * pxPerMM);
    tc.beginPath();
    for (const cmd of path.commands) {
      switch (cmd.type) {
        case 'M': tc.moveTo(cmd.x, cmd.y); break;
        case 'L': tc.lineTo(cmd.x, cmd.y); break;
        case 'C': tc.bezierCurveTo(cmd.x1, cmd.y1, cmd.x2, cmd.y2, cmd.x, cmd.y); break;
        case 'Q': tc.quadraticCurveTo(cmd.x1, cmd.y1, cmd.x, cmd.y); break;
        case 'Z': tc.closePath(); break;
      }
    }
    tc.fillStyle = 'white';
    tc.fill('evenodd');
  } else {
    const fontStr = `${el.bold ? 'bold ' : ''}${fontPx}px system-ui, sans-serif`;
    tc.font = fontStr;
    const met = tc.measureText(el.text);

    const padPx = Math.ceil(fontPx * 0.4);
    W = Math.ceil(met.width) + padPx * 2;
    H = Math.ceil(fontPx * 1.5) + padPx * 2;
    tmp.width = W; tmp.height = H;

    tc.font = fontStr;
    tc.fillStyle = 'white';
    tc.fillText(el.text, padPx, fontPx + padPx * 0.5);
    ox = el.x - padPx / pxPerMM;
    oy = el.y - fontPx / pxPerMM - (padPx * 0.5) / pxPerMM;
  }

  const alpha = tc.getImageData(0, 0, W, H).data;
  const pix   = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) pix[i] = alpha[i * 4 + 3] > 10 ? 1 : 0;

  return { pix, W, H, ox, oy, pxPerMM };
}

function emptyRasterMask(pxPerMM) {
  return { pix: new Uint8Array(0), W: 0, H: 0, ox: 0, oy: 0, pxPerMM };
}

function textToContourGroupsRaster(el, useLoadedFont = !!loadedFont) {
  const { pix, W, H, ox, oy, pxPerMM } = makeTextRasterMask(el, useLoadedFont, 80);
  // マーチングスクエアでアウトライン輪郭線を抽出
  const pixContours = marchingSquares(pix, W, H);
  if (pixContours.length === 0) return [];

  // ピクセル座標 → mm 座標に変換
  const mmContours = pixContours.map(c =>
    douglasPeucker(c.map(([px, py]) => [ox + px / pxPerMM, oy + py / pxPerMM]), 0.03)
  ).filter(c => c.length >= 3 && Math.abs(signedArea(c)) > 0.05);

  if (mmContours.length === 0) return [];
  return organizeContours(mmContours);
}

function rasterMaskToWatertightTriangles(mask, z0, height) {
  const { pix, W, H, ox, oy, pxPerMM } = mask;
  const tris = [];
  const z1 = z0 + height;
  const on = (x, y) => x >= 0 && x < W && y >= 0 && y < H && pix[y * W + x];
  const pt = (x, y, z) => [ox + x / pxPerMM, oy + y / pxPerMM, z];

  const addQuad = (a, b, c, d) => {
    tris.push([a, b, c]);
    tris.push([a, c, d]);
  };

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (!on(x, y)) continue;

      const p00z0 = pt(x,     y,     z0);
      const p10z0 = pt(x + 1, y,     z0);
      const p11z0 = pt(x + 1, y + 1, z0);
      const p01z0 = pt(x,     y + 1, z0);
      const p00z1 = pt(x,     y,     z1);
      const p10z1 = pt(x + 1, y,     z1);
      const p11z1 = pt(x + 1, y + 1, z1);
      const p01z1 = pt(x,     y + 1, z1);

      addQuad(p00z1, p10z1, p11z1, p01z1); // top
      addQuad(p11z0, p10z0, p00z0, p01z0); // bottom

      if (!on(x, y - 1)) addQuad(p10z0, p00z0, p00z1, p10z1); // top edge
      if (!on(x + 1, y)) addQuad(p11z0, p10z0, p10z1, p11z1); // right edge
      if (!on(x, y + 1)) addQuad(p01z0, p11z0, p11z1, p01z1); // bottom edge
      if (!on(x - 1, y)) addQuad(p00z0, p01z0, p01z1, p00z1); // left edge
    }
  }

  return tris;
}

// ============================================================
// マーチングスクエア法（バイナリ画像 → 輪郭ポリゴン群）
// ============================================================
function marchingSquares(pix, W, H) {
  const isOn = (x, y) => x >= 0 && x < W && y >= 0 && y < H && pix[y * W + x];

  // 各2×2セルで引くべきエッジ（エッジ番号: 0=上,1=右,2=下,3=左）
  const SEG = [
    [],          // 0
    [[3,2]],     // 1
    [[2,1]],     // 2
    [[3,1]],     // 3
    [[0,1]],     // 4
    [[0,1],[3,2]],// 5 鞍点
    [[0,2]],     // 6
    [[0,3]],     // 7
    [[0,3]],     // 8
    [[0,2]],     // 9
    [[0,3],[2,1]],// 10 鞍点
    [[0,1]],     // 11
    [[3,1]],     // 12
    [[2,1]],     // 13
    [[3,2]],     // 14
    [],          // 15
  ];

  // エッジの中点座標
  const ep = (e, x, y) => {
    if (e === 0) return [x + 0.5, y];
    if (e === 1) return [x + 1,   y + 0.5];
    if (e === 2) return [x + 0.5, y + 1];
    return             [x,        y + 0.5];
  };

  // 隣接グラフを構築
  const adj  = new Map();
  const pts  = new Map();
  const add  = (a, b) => {
    const ka = `${a[0]},${a[1]}`, kb = `${b[0]},${b[1]}`;
    pts.set(ka, a); pts.set(kb, b);
    (adj.get(ka) ?? (adj.set(ka, []), adj.get(ka))).push(kb);
    (adj.get(kb) ?? (adj.set(kb, []), adj.get(kb))).push(ka);
  };

  for (let y = 0; y < H - 1; y++)
    for (let x = 0; x < W - 1; x++) {
      const idx = (isOn(x,y)?8:0)|(isOn(x+1,y)?4:0)|(isOn(x+1,y+1)?2:0)|(isOn(x,y+1)?1:0);
      for (const [e1, e2] of SEG[idx]) add(ep(e1,x,y), ep(e2,x,y));
    }

  // 閉じた輪郭だけを辿る
  const visited  = new Set();
  const contours = [];

  for (const startKey of adj.keys()) {
    if (visited.has(startKey)) continue;
    const nbrs = adj.get(startKey);
    if (!nbrs || nbrs.length !== 2) continue;

    const contour = [pts.get(startKey)];
    visited.add(startKey);
    let prev = startKey, curr = nbrs[0];

    let closed = false;
    while (curr !== startKey) {
      if (visited.has(curr)) break;
      visited.add(curr);
      contour.push(pts.get(curr));
      const next = (adj.get(curr) ?? []).find(k => k !== prev);
      if (!next) break;
      prev = curr; curr = next;
      if (curr === startKey) closed = true;
    }
    if (closed && contour.length >= 3) contours.push(contour);
  }
  return contours;
}

// Ramer–Douglas–Peucker 折れ線簡略化
function douglasPeucker(pts, eps) {
  if (pts.length <= 2) return pts;
  const [x1, y1] = pts[0], [x2, y2] = pts[pts.length - 1];
  const len = Math.hypot(x2 - x1, y2 - y1);
  let maxD = 0, maxI = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i];
    const d = len < 1e-10
      ? Math.hypot(px - x1, py - y1)
      : Math.abs((y2-y1)*px - (x2-x1)*py + x2*y1 - y2*x1) / len;
    if (d > maxD) { maxD = d; maxI = i; }
  }
  if (maxD > eps) {
    const l = douglasPeucker(pts.slice(0, maxI + 1), eps);
    const r = douglasPeucker(pts.slice(maxI), eps);
    return [...l.slice(0, -1), ...r];
  }
  return [pts[0], pts[pts.length - 1]];
}

// ============================================================
// エクスポート共通：全オブジェクトを生成
// ============================================================
function buildExportObjects() {
  const baseT = +(document.getElementById('base-thickness').value) || 0.8;
  const objs = [
    { name: 'base', tris: boxTriangles(0, 0, 0, cardW, cardH, baseT), color: document.getElementById('base-color').value },
  ];
  for (const el of elements) {
    if (el.type === 'image') {
      const colors = el.vectorGroups?.length
        ? [...new Set(el.vectorGroups.map(g => g.color))]
        : [...new Set((el.pixels || []).map(p => p.color))];
      for (const color of colors) {
        objs.push({ name: `${el.text || 'logo'} ${color}`, tris: imageToTriangles(el, baseT, color), color });
      }
    } else {
      objs.push({ name: el.text || 'text', tris: textToTriangles(el, baseT), color: el.color });
    }
  }
  return objs;
}

// ============================================================
// STL エクスポート
// ============================================================
// ============================================================
// SVG エクスポート（ベクター）
// ============================================================
function exportSVG() {
  try {
    const baseColor = document.getElementById('base-color').value;
    const lines = [
      `<svg xmlns="http://www.w3.org/2000/svg"`,
      `     width="${cardW}mm" height="${cardH}mm"`,
      `     viewBox="0 0 ${cardW} ${cardH}">`,
      `  <rect width="${cardW}" height="${cardH}" fill="${baseColor}"/>`,
    ];

    for (const el of elements) {
      const fontSize = (el.size * 0.353).toFixed(4);
      if (el.type === 'qr') {
        const d = svgPathDFromQR(el);
        lines.push(`  <path fill="${el.color}" d="${d}"/>`);
      } else if (el.type === 'image') {
        const byColor = groupImagePixelsByColor(el);
        for (const [color, pixels] of byColor) {
          const d = svgPathDFromImagePixels(el, pixels);
          lines.push(`  <path fill="${color}" d="${d}"/>`);
        }
      } else if (loadedFont) {
        // 実際に塗りつぶされた文字マスクから、文字部分だけの閉じたパスを生成
        const mask = makeTextRasterMask(el, true, 24);
        const d = svgPathDFromRasterMask(mask);
        lines.push(`  <path fill="${el.color}" fill-rule="evenodd" clip-rule="evenodd" d="${d}"/>`);
      } else {
        // <text> 要素（システムフォント依存だが完全ベクター）
        const bold = el.bold ? ' font-weight="bold"' : '';
        lines.push(`  <text x="${el.x}" y="${el.y}" font-size="${fontSize}"${bold} fill="${el.color}" font-family="system-ui, sans-serif">${escSvg(el.text)}</text>`);
      }
    }

    lines.push('</svg>');
    const svg = lines.join('\n');
    const bytes = new TextEncoder().encode(svg);
    downloadBlob(bytes.buffer, 'namecard.svg', 'image/svg+xml');
  } catch(e) {
    alert('SVGエクスポートエラー: ' + e.message);
    console.error(e);
  }
}

function f(n) { return n.toFixed(4); }

function svgPathDFromQR(el) {
  const matrix = getQRMatrix(el.text);
  const count = matrix.length;
  if (!count) return '';
  const module = el.size / count;
  const parts = [];
  for (let y = 0; y < count; y++) {
    for (let x = 0; x < count; x++) {
      if (!matrix[y][x]) continue;
      const x0 = el.x + x * module;
      const y0 = el.y + y * module;
      const x1 = x0 + module;
      const y1 = y0 + module;
      parts.push(`M${f(x0)},${f(y0)}L${f(x1)},${f(y0)}L${f(x1)},${f(y1)}L${f(x0)},${f(y1)}Z`);
    }
  }
  return parts.join('');
}

function groupImagePixelsByColor(el) {
  const map = new Map();
  for (const p of el.pixels || []) {
    if (!map.has(p.color)) map.set(p.color, []);
    map.get(p.color).push(p);
  }
  return map;
}

function svgPathDFromImagePixels(el, pixels) {
  const cell = el.size / el.gridW;
  const parts = [];
  for (const p of pixels) {
    const x0 = el.x + p.x * cell;
    const y0 = el.y + p.y * cell;
    const x1 = x0 + cell;
    const y1 = y0 + cell;
    parts.push(`M${f(x0)},${f(y0)}L${f(x1)},${f(y0)}L${f(x1)},${f(y1)}L${f(x0)},${f(y1)}Z`);
  }
  return parts.join('');
}

function svgPathDFromRasterMask(mask) {
  const { pix, W, H, ox, oy, pxPerMM } = mask;
  const parts = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (!pix[y * W + x]) continue;
      const x0 = ox + x / pxPerMM;
      const y0 = oy + y / pxPerMM;
      const x1 = ox + (x + 1) / pxPerMM;
      const y1 = oy + (y + 1) / pxPerMM;
      parts.push(`M${f(x0)},${f(y0)}L${f(x1)},${f(y0)}L${f(x1)},${f(y1)}L${f(x0)},${f(y1)}Z`);
    }
  }
  return parts.join('');
}

function svgPathDFromContourGroups(groups) {
  return groups.map(({ outer, holes }) => {
    return [outer, ...holes].map(contour => {
      if (!contour.length) return '';
      const [start, ...rest] = contour;
      return `M${f(start[0])},${f(start[1])}` + rest.map(p => `L${f(p[0])},${f(p[1])}`).join('') + 'Z';
    }).join('');
  }).join('');
}

function escSvg(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function exportSTL() {
  try {
    const allTris = buildExportObjects().flatMap(o => o.tris);
    if (allTris.length === 0) { alert('ジオメトリが空です。要素を追加してください。'); return; }
    downloadBlob(buildSTLBinary(allTris), 'namecard.stl', 'application/octet-stream');
  } catch(e) {
    alert('STLエクスポートエラー: ' + e.message);
    console.error(e);
  }
}

function buildSTLBinary(tris) {
  const buf  = new ArrayBuffer(84 + tris.length * 50);
  const view = new DataView(buf);
  view.setUint32(80, tris.length, true);
  let off = 84;
  for (const [a, b, c] of tris) {
    const n = calcNormal(a, b, c);
    for (const v of [n, a, b, c]) {
      view.setFloat32(off, v[0], true); off += 4;
      view.setFloat32(off, v[1], true); off += 4;
      view.setFloat32(off, v[2], true); off += 4;
    }
    view.setUint16(off, 0, true); off += 2;
  }
  return buf;
}

function calcNormal(a, b, c) {
  const u = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
  const v = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
  const n = [u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]];
  const len = Math.hypot(...n) || 1;
  return n.map(x => x / len);
}

// ============================================================
// 3MF エクスポート（OrcaSlicer 用）
// ============================================================
async function export3MF() {
  try {
    const rawObjs = buildExportObjects().filter(obj => obj.tris.length > 0);

    // 頂点重複排除してインデックスメッシュに変換
    const meshObjs = rawObjs.map((obj, i) => {
      const vertMap = new Map();
      const verts   = [];
      const idxTris = [];
      for (const [a, b, c] of obj.tris) {
        idxTris.push([a, b, c].map(v => {
          const key = `${v[0].toFixed(4)},${v[1].toFixed(4)},${v[2].toFixed(4)}`;
          if (!vertMap.has(key)) { vertMap.set(key, verts.length); verts.push(v); }
          return vertMap.get(key);
        }));
      }
      return { id: i + 1, name: obj.name, color: obj.color, verts, tris: idxTris };
    });

    const xml = build3MFXml(meshObjs);
    const zip = await buildZip({ '3D/3dmodel.model': xml });
    downloadBlob(zip, 'namecard.3mf', 'application/octet-stream');
  } catch(e) {
    alert('3MFエクスポートエラー: ' + e.message);
    console.error(e);
  }
}

function build3MFXml(objects) {
  const colorGroupId = objects.length + 1;
  const colorsXml = objects.map(obj => {
    const c = normalize3MFColor(obj.color);
    return `      <m:color color="#${c}FF"/>`;
  }).join('\n');

  const objsXml = objects.map((obj, i) => {
    const vertsXml = obj.verts.map(([x,y,z]) =>
      `          <vertex x="${x.toFixed(4)}" y="${y.toFixed(4)}" z="${z.toFixed(4)}"/>`
    ).join('\n');
    const trisXml = obj.tris.map(([a,b,c]) =>
      `          <triangle v1="${a}" v2="${b}" v3="${c}"/>`
    ).join('\n');
    return `    <object id="${obj.id}" type="model" name="${escXmlAttr(obj.name)}" pid="${colorGroupId}" pindex="${i}">
      <mesh>
        <vertices>
${vertsXml}
        </vertices>
        <triangles>
${trisXml}
        </triangles>
      </mesh>
    </object>`;
  }).join('\n');

  const buildXml = objects.map(obj => `    <item objectid="${obj.id}"/>`).join('\n');

  return `<?xml version="1.0" encoding="UTF-8"?>
<model unit="millimeter"
  xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"
  xmlns:m="http://schemas.microsoft.com/3dmanufacturing/material/2015/02"
  requiredextensions="m">
  <resources>
    <m:colorgroup id="${colorGroupId}">
${colorsXml}
    </m:colorgroup>
${objsXml}
  </resources>
  <build>
${buildXml}
  </build>
</model>`;
}

function normalize3MFColor(color) {
  const hex = String(color || '').replace('#', '').trim();
  if (/^[0-9a-fA-F]{6}$/.test(hex)) return hex.toUpperCase();
  if (/^[0-9a-fA-F]{3}$/.test(hex)) return hex.split('').map(ch => ch + ch).join('').toUpperCase();
  return '000000';
}

function escXmlAttr(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// ============================================================
// ZIP 生成（外部依存なし）
// ============================================================
async function buildZip(files) {
  const allFiles = {
    '[Content_Types].xml':
`<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/>
</Types>`,
    '_rels/.rels':
`<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel" Target="/3D/3dmodel.model"/>
</Relationships>`,
    ...files,
  };

  const enc     = new TextEncoder();
  const entries = [];
  let offset    = 0;

  for (const [name, content] of Object.entries(allFiles)) {
    const nb  = enc.encode(name);
    const db  = enc.encode(content);
    const crc = crc32(db);
    const lh  = localHeader(nb, db, crc);
    entries.push({ nb, db, crc, lh, offset });
    offset += lh.length + db.length;
  }

  const cdEntries = entries.map(e => centralDir(e.nb, e.db, e.crc, e.offset));
  const cdSize    = cdEntries.reduce((s, e) => s + e.length, 0);
  const eocd      = endOfCD(entries.length, cdSize, offset);

  const parts = [...entries.flatMap(e => [e.lh, e.db]), ...cdEntries, eocd];
  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let pos = 0;
  for (const p of parts) { out.set(p, pos); pos += p.length; }
  return out.buffer;
}

function localHeader(name, data, crc) {
  const b = new DataView(new ArrayBuffer(30 + name.length));
  b.setUint32(0, 0x04034b50, true);
  b.setUint16(4, 20, true); b.setUint16(6, 0, true); b.setUint16(8, 0, true);
  b.setUint16(10, 0, true); b.setUint16(12, 0, true);
  b.setUint32(14, crc, true); b.setUint32(18, data.length, true); b.setUint32(22, data.length, true);
  b.setUint16(26, name.length, true); b.setUint16(28, 0, true);
  new Uint8Array(b.buffer).set(name, 30);
  return new Uint8Array(b.buffer);
}

function centralDir(name, data, crc, off) {
  const b = new DataView(new ArrayBuffer(46 + name.length));
  b.setUint32(0, 0x02014b50, true);
  b.setUint16(4, 20, true); b.setUint16(6, 20, true); b.setUint16(8, 0, true);
  b.setUint16(10, 0, true); b.setUint16(12, 0, true); b.setUint16(14, 0, true);
  b.setUint32(16, crc, true); b.setUint32(20, data.length, true); b.setUint32(24, data.length, true);
  b.setUint16(28, name.length, true); b.setUint16(30, 0, true); b.setUint16(32, 0, true);
  b.setUint16(34, 0, true); b.setUint16(36, 0, true); b.setUint32(38, 0, true); b.setUint32(42, off, true);
  new Uint8Array(b.buffer).set(name, 46);
  return new Uint8Array(b.buffer);
}

function endOfCD(count, cdSize, cdOffset) {
  const b = new DataView(new ArrayBuffer(22));
  b.setUint32(0, 0x06054b50, true); b.setUint16(4, 0, true); b.setUint16(6, 0, true);
  b.setUint16(8, count, true); b.setUint16(10, count, true);
  b.setUint32(12, cdSize, true); b.setUint32(16, cdOffset, true); b.setUint16(20, 0, true);
  return new Uint8Array(b.buffer);
}

function crc32(data) {
  let crc = 0xFFFFFFFF;
  for (const b of data) {
    crc ^= b;
    for (let i = 0; i < 8; i++) crc = (crc & 1) ? (crc >>> 1) ^ 0xEDB88320 : crc >>> 1;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function downloadBlob(data, filename, mime) {
  const url = URL.createObjectURL(new Blob([data], { type: mime }));
  const a   = Object.assign(document.createElement('a'), { href: url, download: filename });
  a.click();
  URL.revokeObjectURL(url);
}
