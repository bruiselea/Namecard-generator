<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名刺ジェネレーター</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  header {
    padding: 12px 20px;
    background: #111;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #fff; }
  header .spacer { flex: 1; }
  button.export-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button.export-btn:hover { background: #1d4ed8; }

  .main { display: flex; flex: 1; overflow: hidden; }

  /* 左パネル */
  .panel {
    width: 280px;
    background: #222;
    border-right: 1px solid #333;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .panel-section {
    padding: 14px 16px;
    border-bottom: 1px solid #333;
  }
  .panel-section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 10px; }

  label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; margin-top: 10px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #444;
    color: #e0e0e0;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  input[type="color"] {
    width: 100%;
    height: 32px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    cursor: pointer;
    padding: 2px;
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  button.add-btn {
    width: 100%;
    background: #333;
    border: 1px dashed #555;
    color: #aaa;
    padding: 8px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
  }
  button.add-btn:hover { background: #3a3a3a; color: #fff; }

  /* 要素リスト */
  .element-list { padding: 10px 16px; flex: 1; }
  .element-list h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 10px; }
  .element-item {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .element-item:hover { border-color: #666; }
  .element-item.selected { border-color: #2563eb; background: #1e3a5f; }
  .element-item .color-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid #666;
  }
  .element-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .element-item .del-btn {
    background: none; border: none; color: #666; cursor: pointer; font-size: 14px; padding: 0 2px;
  }
  .element-item .del-btn:hover { color: #e55; }

  /* 選択要素プロパティ */
  .properties {
    padding: 14px 16px;
    border-top: 1px solid #333;
    background: #1e1e1e;
  }
  .properties h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 10px; }
  .properties.hidden { display: none; }

  /* キャンバスエリア */
  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    overflow: hidden;
    position: relative;
  }
  .canvas-wrap {
    position: relative;
  }
  #namecard-canvas {
    display: block;
    cursor: default;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

<header>
  <h1>名刺ジェネレーター</h1>
  <div class="spacer"></div>
  <button class="export-btn" onclick="exportSTL()">STL エクスポート</button>
  <button class="export-btn" style="background:#16a34a" onclick="export3MF()">3MF エクスポート</button>
</header>

<div class="main">
  <!-- 左パネル -->
  <div class="panel">
    <!-- カード設定 -->
    <div class="panel-section">
      <h2>カード設定</h2>
      <label>サイズ</label>
      <select id="card-size" onchange="onCardSizeChange()">
        <option value="91x55">標準 91×55mm</option>
        <option value="89x51">欧米 89×51mm</option>
        <option value="custom">カスタム</option>
      </select>
      <div id="custom-size" style="display:none">
        <div class="row2" style="margin-top:8px">
          <div><label>幅(mm)</label><input type="number" id="card-w" value="91" min="10" max="200" oninput="renderCanvas()"></div>
          <div><label>高さ(mm)</label><input type="number" id="card-h" value="55" min="10" max="200" oninput="renderCanvas()"></div>
        </div>
      </div>
      <label>ベースの厚み(mm)</label>
      <input type="number" id="base-thickness" value="0.8" min="0.2" max="5" step="0.1">
      <label>ベースの色</label>
      <input type="color" id="base-color" value="#ffffff" oninput="renderCanvas()">
    </div>

    <!-- 要素リスト -->
    <div class="element-list">
      <h2>要素</h2>
      <div id="element-list-container"></div>
      <button class="add-btn" onclick="addElement()">＋ テキストを追加</button>
    </div>

    <!-- 選択要素プロパティ -->
    <div class="properties hidden" id="properties-panel">
      <h2>プロパティ</h2>
      <label>テキスト</label>
      <input type="text" id="prop-text" oninput="updateSelectedProp('text', this.value)">
      <label>フォントサイズ (pt)</label>
      <input type="number" id="prop-size" value="12" min="4" max="120" oninput="updateSelectedProp('size', +this.value)">
      <label>太字</label>
      <select id="prop-bold" onchange="updateSelectedProp('bold', this.value === 'true')">
        <option value="false">標準</option>
        <option value="true">太字</option>
      </select>
      <label>色</label>
      <input type="color" id="prop-color" oninput="updateSelectedProp('color', this.value)">
      <label>押し出し高さ (mm)</label>
      <input type="number" id="prop-extrude" value="0.5" min="0.1" max="5" step="0.1" oninput="updateSelectedProp('extrude', +this.value)">
      <div class="row2" style="margin-top:10px">
        <div><label>X (mm)</label><input type="number" id="prop-x" step="0.5" oninput="updateSelectedProp('x', +this.value)"></div>
        <div><label>Y (mm)</label><input type="number" id="prop-y" step="0.5" oninput="updateSelectedProp('y', +this.value)"></div>
      </div>
    </div>
  </div>

  <!-- キャンバスエリア -->
  <div class="canvas-area">
    <div class="canvas-wrap">
      <canvas id="namecard-canvas"></canvas>
    </div>
  </div>
</div>

<script>
// ============================================================
// 状態管理
// ============================================================
const SCALE = 3; // 1mm = 3px（表示用）

let cardW = 91, cardH = 55;
let selectedId = null;
let dragState = null;

let elements = [
  { id: uid(), text: '山田 太郎', x: 8, y: 12, size: 20, bold: true,  color: '#111111', extrude: 0.5 },
  { id: uid(), text: 'Taro Yamada',     x: 8, y: 20, size: 10, bold: false, color: '#333333', extrude: 0.4 },
  { id: uid(), text: '株式会社サンプル',  x: 8, y: 30, size: 9,  bold: false, color: '#2563eb', extrude: 0.4 },
  { id: uid(), text: '090-0000-0000',   x: 8, y: 42, size: 8,  bold: false, color: '#555555', extrude: 0.3 },
  { id: uid(), text: 'sample@example.com', x: 8, y: 48, size: 7, bold: false, color: '#555555', extrude: 0.3 },
];

function uid() { return Math.random().toString(36).slice(2); }

// ============================================================
// カードサイズ
// ============================================================
function onCardSizeChange() {
  const v = document.getElementById('card-size').value;
  const customDiv = document.getElementById('custom-size');
  if (v === 'custom') {
    customDiv.style.display = '';
  } else {
    customDiv.style.display = 'none';
    [cardW, cardH] = v.split('x').map(Number);
    document.getElementById('card-w').value = cardW;
    document.getElementById('card-h').value = cardH;
    renderCanvas();
  }
}

// ============================================================
// 描画
// ============================================================
const canvas = document.getElementById('namecard-canvas');
const ctx = canvas.getContext('2d');

function renderCanvas() {
  cardW = +document.getElementById('card-w').value || 91;
  cardH = +document.getElementById('card-h').value || 55;
  canvas.width  = cardW * SCALE;
  canvas.height = cardH * SCALE;

  const baseColor = document.getElementById('base-color').value;
  ctx.fillStyle = baseColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 要素描画
  for (const el of elements) {
    const x = el.x * SCALE;
    const y = el.y * SCALE;
    const px = el.size * SCALE * 0.35; // pt→px概算
    ctx.font = `${el.bold ? 'bold ' : ''}${px}px system-ui, sans-serif`;
    ctx.fillStyle = el.color;
    ctx.fillText(el.text, x, y);
  }

  // 選択ハイライト
  if (selectedId) {
    const el = elements.find(e => e.id === selectedId);
    if (el) {
      const px = el.size * SCALE * 0.35;
      ctx.font = `${el.bold ? 'bold ' : ''}${px}px system-ui, sans-serif`;
      const metrics = ctx.measureText(el.text);
      const w = metrics.width;
      const h = px;
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(el.x * SCALE - 2, el.y * SCALE - h, w + 4, h + 4);
      ctx.setLineDash([]);
    }
  }
}

// ============================================================
// 要素リスト UI
// ============================================================
function renderElementList() {
  const container = document.getElementById('element-list-container');
  container.innerHTML = '';
  for (const el of elements) {
    const item = document.createElement('div');
    item.className = 'element-item' + (el.id === selectedId ? ' selected' : '');
    item.innerHTML = `
      <span class="color-dot" style="background:${el.color}"></span>
      <span class="label">${escHtml(el.text)}</span>
      <button class="del-btn" onclick="deleteElement('${el.id}', event)">✕</button>
    `;
    item.addEventListener('click', () => selectElement(el.id));
    container.appendChild(item);
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// 選択・プロパティ
// ============================================================
function selectElement(id) {
  selectedId = id;
  const el = elements.find(e => e.id === id);
  const panel = document.getElementById('properties-panel');
  if (el) {
    panel.classList.remove('hidden');
    document.getElementById('prop-text').value   = el.text;
    document.getElementById('prop-size').value   = el.size;
    document.getElementById('prop-bold').value   = String(el.bold);
    document.getElementById('prop-color').value  = el.color;
    document.getElementById('prop-extrude').value = el.extrude;
    document.getElementById('prop-x').value      = el.x;
    document.getElementById('prop-y').value      = el.y;
  } else {
    panel.classList.add('hidden');
  }
  renderElementList();
  renderCanvas();
}

function updateSelectedProp(key, value) {
  const el = elements.find(e => e.id === selectedId);
  if (!el) return;
  el[key] = value;
  if (key === 'x') document.getElementById('prop-x').value = value;
  if (key === 'y') document.getElementById('prop-y').value = value;
  renderElementList();
  renderCanvas();
}

function addElement() {
  const el = { id: uid(), text: '新しいテキスト', x: 10, y: 20, size: 10, bold: false, color: '#000000', extrude: 0.4 };
  elements.push(el);
  selectElement(el.id);
}

function deleteElement(id, e) {
  e.stopPropagation();
  elements = elements.filter(el => el.id !== id);
  if (selectedId === id) {
    selectedId = null;
    document.getElementById('properties-panel').classList.add('hidden');
  }
  renderElementList();
  renderCanvas();
}

// ============================================================
// ドラッグ
// ============================================================
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / SCALE;
  const my = (e.clientY - rect.top)  / SCALE;

  // クリックした要素を探す（後ろから＝上の要素優先）
  let hit = null;
  for (let i = elements.length - 1; i >= 0; i--) {
    const el = elements[i];
    const px = el.size * SCALE * 0.35;
    ctx.font = `${el.bold ? 'bold ' : ''}${px}px system-ui, sans-serif`;
    const w = ctx.measureText(el.text).width / SCALE;
    const h = el.size * 0.35;
    if (mx >= el.x - 1 && mx <= el.x + w + 1 && my >= el.y - h - 1 && my <= el.y + 2) {
      hit = el;
      break;
    }
  }

  if (hit) {
    selectElement(hit.id);
    dragState = { id: hit.id, startMX: mx, startMY: my, startX: hit.x, startY: hit.y };
    canvas.style.cursor = 'grabbing';
  } else {
    selectedId = null;
    document.getElementById('properties-panel').classList.add('hidden');
    renderElementList();
    renderCanvas();
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!dragState) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / SCALE;
  const my = (e.clientY - rect.top)  / SCALE;
  const dx = mx - dragState.startMX;
  const dy = my - dragState.startMY;
  const el = elements.find(e => e.id === dragState.id);
  if (el) {
    el.x = Math.round((dragState.startX + dx) * 10) / 10;
    el.y = Math.round((dragState.startY + dy) * 10) / 10;
    document.getElementById('prop-x').value = el.x;
    document.getElementById('prop-y').value = el.y;
    renderCanvas();
  }
});

canvas.addEventListener('mouseup', () => {
  dragState = null;
  canvas.style.cursor = 'default';
});

canvas.addEventListener('mouseleave', () => {
  dragState = null;
  canvas.style.cursor = 'default';
});

// ============================================================
// STL エクスポート（シンプル版・テキストはバウンディングボックス）
// ============================================================
function exportSTL() {
  const baseT  = +(document.getElementById('base-thickness').value) || 0.8;
  const triangles = [];

  // ベース板
  addBox(triangles, 0, 0, 0, cardW, cardH, baseT);

  // 各要素（バウンディングボックスで近似）
  for (const el of elements) {
    const px = el.size * 0.35;
    const approxW = el.text.length * px * 0.6;
    const approxH = px;
    const bx = el.x;
    const by = el.y - approxH;
    addBox(triangles, bx, by, baseT, approxW, approxH, el.extrude);
  }

  const stl = buildSTL(triangles);
  downloadBlob(stl, 'namecard.stl', 'application/octet-stream');
}

function addBox(tris, x, y, z, w, h, d) {
  // 6面 × 2三角形
  const v = [
    [x,   y,   z],
    [x+w, y,   z],
    [x+w, y+h, z],
    [x,   y+h, z],
    [x,   y,   z+d],
    [x+w, y,   z+d],
    [x+w, y+h, z+d],
    [x,   y+h, z+d],
  ];
  const faces = [
    [0,3,2],[0,2,1], // bottom
    [4,5,6],[4,6,7], // top
    [0,1,5],[0,5,4], // front
    [2,3,7],[2,7,6], // back
    [1,2,6],[1,6,5], // right
    [3,0,4],[3,4,7], // left
  ];
  for (const [a,b,c] of faces) {
    tris.push([v[a], v[b], v[c]]);
  }
}

function buildSTL(tris) {
  const buf = new ArrayBuffer(84 + tris.length * 50);
  const view = new DataView(buf);
  view.setUint32(80, tris.length, true);
  let offset = 84;
  for (const [a, b, c] of tris) {
    const n = calcNormal(a, b, c);
    for (const v of [n, a, b, c]) {
      view.setFloat32(offset,   v[0], true); offset += 4;
      view.setFloat32(offset,   v[1], true); offset += 4;
      view.setFloat32(offset,   v[2], true); offset += 4;
    }
    view.setUint16(offset, 0, true); offset += 2;
  }
  return buf;
}

function calcNormal(a, b, c) {
  const u = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
  const v = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
  const n = [
    u[1]*v[2] - u[2]*v[1],
    u[2]*v[0] - u[0]*v[2],
    u[0]*v[1] - u[1]*v[0],
  ];
  const len = Math.hypot(...n) || 1;
  return n.map(x => x/len);
}

// ============================================================
// 3MF エクスポート（要素ごとに色情報付き）
// ============================================================
async function export3MF() {
  const baseT = +(document.getElementById('base-thickness').value) || 0.8;
  const baseColor = document.getElementById('base-color').value;

  const objects = [];

  // ベース板
  objects.push({ id: 1, color: baseColor, mesh: boxMesh(0, 0, 0, cardW, cardH, baseT) });

  // 各テキスト要素
  let objId = 2;
  for (const el of elements) {
    const px = el.size * 0.35;
    const approxW = el.text.length * px * 0.6;
    const approxH = px;
    const bx = el.x;
    const by = el.y - approxH;
    objects.push({ id: objId++, color: el.color, mesh: boxMesh(bx, by, baseT, approxW, approxH, el.extrude) });
  }

  const xml = build3MFXml(objects);
  const zip = await buildZip({ '3D/3dmodel.model': xml });
  downloadBlob(zip, 'namecard.3mf', 'application/octet-stream');
}

function boxMesh(x, y, z, w, h, d) {
  const verts = [
    [x,   y,   z],   [x+w, y,   z],   [x+w, y+h, z],   [x,   y+h, z],
    [x,   y,   z+d], [x+w, y,   z+d], [x+w, y+h, z+d], [x,   y+h, z+d],
  ];
  const tris = [
    [0,3,2],[0,2,1],
    [4,5,6],[4,6,7],
    [0,1,5],[0,5,4],
    [2,3,7],[2,7,6],
    [1,2,6],[1,6,5],
    [3,0,4],[3,4,7],
  ];
  return { verts, tris };
}

function hexToRGB01(hex) {
  const r = parseInt(hex.slice(1,3), 16) / 255;
  const g = parseInt(hex.slice(3,5), 16) / 255;
  const b = parseInt(hex.slice(5,7), 16) / 255;
  return [r, g, b];
}

function build3MFXml(objects) {
  let vertOffset = 0;
  let objXml = '';

  for (const obj of objects) {
    const { verts, tris } = obj.mesh;
    const [r, g, b] = hexToRGB01(obj.color);
    const colorHex = obj.color.slice(1).toUpperCase() + 'FF';

    let verticesXml = verts.map(([x,y,z]) =>
      `        <vertex x="${x.toFixed(4)}" y="${y.toFixed(4)}" z="${z.toFixed(4)}"/>`
    ).join('\n');

    let trianglesXml = tris.map(([a,b,c]) =>
      `        <triangle v1="${a}" v2="${b}" v3="${c}"/>`
    ).join('\n');

    objXml += `
    <object id="${obj.id}" type="model" p:colorid="1">
      <mesh>
        <vertices>
${verticesXml}
        </vertices>
        <triangles>
${trianglesXml}
        </triangles>
      </mesh>
    </object>`;
  }

  // 色グループ
  let colorsXml = objects.map(obj => {
    const c = obj.color.slice(1).toUpperCase() + 'FF';
    return `      <p:color color="#${c}"/>`;
  }).join('\n');

  return `<?xml version="1.0" encoding="UTF-8"?>
<model unit="millimeter"
  xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"
  xmlns:p="http://schemas.microsoft.com/3dmanufacturing/production/2015/06">
  <resources>
    <p:colorgroup id="1">
${colorsXml}
    </p:colorgroup>
${objXml}
    <build>
${objects.map((o,i) => `      <item objectid="${o.id}" p:colorindex="${i}"/>`).join('\n')}
    </build>
  </resources>
</model>`;
}

// ============================================================
// 簡易 ZIP 生成（外部ライブラリ不要）
// ============================================================
async function buildZip(files) {
  // _rels/.rels と [Content_Types].xml も必要
  const allFiles = {
    '[Content_Types].xml': `<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/>
</Types>`,
    '_rels/.rels': `<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel" Target="/3D/3dmodel.model"/>
</Relationships>`,
    ...files,
  };

  const encoder = new TextEncoder();
  const entries = [];
  let offset = 0;
  const centralDir = [];

  for (const [name, content] of Object.entries(allFiles)) {
    const nameBytes  = encoder.encode(name);
    const dataBytes  = encoder.encode(content);
    const crc = crc32(dataBytes);
    const localHeader = buildLocalFileHeader(nameBytes, dataBytes, crc);
    entries.push({ nameBytes, dataBytes, crc, localHeader, offset });
    centralDir.push({ nameBytes, dataBytes, crc, offset });
    offset += localHeader.length + dataBytes.length;
  }

  const cdEntries = centralDir.map(e => buildCentralDirEntry(e.nameBytes, e.dataBytes, e.crc, e.offset));
  const cdSize   = cdEntries.reduce((s, e) => s + e.length, 0);
  const eocd     = buildEOCD(cdEntries.length, cdSize, offset);

  const parts = [
    ...entries.flatMap(e => [e.localHeader, e.dataBytes]),
    ...cdEntries,
    eocd,
  ];
  const total = parts.reduce((s, p) => s + p.length, 0);
  const result = new Uint8Array(total);
  let pos = 0;
  for (const p of parts) { result.set(p, pos); pos += p.length; }
  return result.buffer;
}

function buildLocalFileHeader(name, data, crc) {
  const buf = new ArrayBuffer(30 + name.length);
  const v   = new DataView(buf);
  v.setUint32(0, 0x04034b50, false); // sig LE
  v.setUint16(4, 20, true);          // version needed
  v.setUint16(6, 0, true);           // flags
  v.setUint16(8, 0, true);           // compression (store)
  v.setUint16(10, 0, true);          // mod time
  v.setUint16(12, 0, true);          // mod date
  v.setUint32(14, crc, true);
  v.setUint32(18, data.length, true);
  v.setUint32(22, data.length, true);
  v.setUint16(26, name.length, true);
  v.setUint16(28, 0, true);
  new Uint8Array(buf).set(name, 30);
  return new Uint8Array(buf);
}

function buildCentralDirEntry(name, data, crc, localOffset) {
  const buf = new ArrayBuffer(46 + name.length);
  const v   = new DataView(buf);
  v.setUint32(0, 0x02014b50, false);
  v.setUint16(4, 20, true);
  v.setUint16(6, 20, true);
  v.setUint16(8, 0, true);
  v.setUint16(10, 0, true);
  v.setUint16(12, 0, true);
  v.setUint16(14, 0, true);
  v.setUint32(16, crc, true);
  v.setUint32(20, data.length, true);
  v.setUint32(24, data.length, true);
  v.setUint16(28, name.length, true);
  v.setUint16(30, 0, true);
  v.setUint16(32, 0, true);
  v.setUint16(34, 0, true);
  v.setUint16(36, 0, true);
  v.setUint32(38, 0, true);
  v.setUint32(42, localOffset, true);
  new Uint8Array(buf).set(name, 46);
  return new Uint8Array(buf);
}

function buildEOCD(count, cdSize, cdOffset) {
  const buf = new ArrayBuffer(22);
  const v   = new DataView(buf);
  v.setUint32(0, 0x06054b50, false);
  v.setUint16(4, 0, true);
  v.setUint16(6, 0, true);
  v.setUint16(8, count, true);
  v.setUint16(10, count, true);
  v.setUint32(12, cdSize, true);
  v.setUint32(16, cdOffset, true);
  v.setUint16(20, 0, true);
  return new Uint8Array(buf);
}

function crc32(data) {
  let crc = 0xFFFFFFFF;
  for (const b of data) {
    crc ^= b;
    for (let i = 0; i < 8; i++) {
      crc = (crc & 1) ? (crc >>> 1) ^ 0xEDB88320 : crc >>> 1;
    }
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function downloadBlob(data, filename, mime) {
  const blob = new Blob([data], { type: mime });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
