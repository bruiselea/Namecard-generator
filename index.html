<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名刺ジェネレーター</title>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  header {
    padding: 12px 20px;
    background: #111;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #fff; }
  header .spacer { flex: 1; }
  .draft-actions { display: flex; gap: 6px; }
  .draft-btn { padding: 6px 11px; border: 1px solid #555; border-radius: 5px; background: #2a2a2a; color: #ddd; cursor: pointer; }
  .draft-btn:hover { border-color: #777; background: #333; }
  .draft-status { color: #9ca3af; font-size: 11px; }
  .draft-status.ok { color: #4ade80; }
  .draft-status.error { color: #f87171; }
  button.export-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button.export-btn:hover { background: #1d4ed8; }
  button.export-btn.green { background: #16a34a; }
  button.export-btn.green:hover { background: #15803d; }

  .main { display: flex; flex: 1; overflow: hidden; }

  .panel {
    width: 280px;
    background: #222;
    border-right: 1px solid #333;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .panel-section {
    padding: 14px 16px;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  .panel-section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 10px; }

  label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; margin-top: 10px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #444;
    color: #e0e0e0;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  input[type="color"] {
    width: 100%;
    height: 32px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    cursor: pointer;
    padding: 2px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .template-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .template-btn {
    background: #2a2a2a;
    border: 1px solid #444;
    color: #ddd;
    padding: 8px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .template-btn:hover { border-color: #666; background: #333; }
  .template-btn.selected { border-color: #2563eb; background: #1e3a5f; }

  button.add-btn {
    width: 100%;
    background: #333;
    border: 1px dashed #555;
    color: #aaa;
    padding: 8px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
  }
  button.add-btn:hover { background: #3a3a3a; color: #fff; }

  .element-list { padding: 10px 16px; flex: 1; min-height: 0; }
  .element-list h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 10px; }
  .element-item {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .element-item:hover { border-color: #666; }
  .element-item.selected { border-color: #2563eb; background: #1e3a5f; }
  .element-item .color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid #666; }
  .element-item .elabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .element-item .del-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; padding: 0 2px; }
  .element-item .del-btn:hover { color: #e55; }

  .properties {
    padding: 14px 16px;
    border-top: 1px solid #333;
    background: #1e1e1e;
    flex-shrink: 0;
  }
  .properties-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .properties h2 { flex: 1; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; }
  .properties-close { background: none; border: none; color: #777; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .properties-close:hover { color: #eee; }
  .properties.hidden { display: none; }

  .canvas-area {
    flex: 1;
    background: pink;
    overflow: hidden;
    position: relative;
  }
  #namecard-canvas {
    position: absolute;
    cursor: default;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    transform-origin: 0 0;
    touch-action: none;
  }
  .zoom-hint {
    position: absolute;
    bottom: 10px; right: 12px;
    font-size: 11px; color: #555;
    pointer-events: none;
    user-select: none;
  }

  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    background: #f59e0b22;
    color: #f59e0b;
    border: 1px solid #f59e0b44;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge.ok { background: #4ade8022; color: #4ade80; border-color: #4ade8044; }
  .required-mark { color: #f87171; font-size: 10px; margin-left: 4px; }
  .question-picker { display: grid; gap: 5px; margin-top: 6px; }
  .question-option {
    display: flex; align-items: flex-start; gap: 7px; margin: 0; padding: 5px 7px;
    border: 1px solid #3f3f3f; border-radius: 4px; color: #ccc; cursor: pointer;
  }
  .question-option:has(input:checked) { border-color: #2563eb; background: #1e3a5f; }
  .question-option input { flex-shrink: 0; margin-top: 2px; }
  .question-option:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }
  .question-count { margin-top: 7px; font-size: 11px; color: #9ca3af; }
  .question-count.complete { color: #4ade80; }
  .question-count.error { color: #f87171; }
  .question-answers { margin-top: 10px; }
  .background-design-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .background-design-btn {
    background: #2a2a2a; border: 1px solid #444; color: #ddd; border-radius: 5px;
    padding: 6px; font-size: 11px; cursor: pointer; text-align: left;
  }
  .background-design-btn:hover { border-color: #777; }
  .background-design-btn.selected { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
  .background-preview { display: block; height: 24px; margin-bottom: 5px; border-radius: 3px; border: 1px solid #555; }
  .background-preview.plain { background: #fff; }
  .background-preview.sky { background: linear-gradient(165deg, #dbeafe 0 65%, #bfdbfe 65% 100%); }
  .background-preview.cool {
    background:
      linear-gradient(90deg, #111827 0 4%, #22d3ee 4% 5.5%, transparent 5.5%),
      linear-gradient(180deg, #111827 0 10%, #22d3ee 10% 16%, transparent 16%),
      #e5e7eb;
  }
  .background-preview.cute { background: radial-gradient(circle at 22% 35%, #fb7185 0 8%, transparent 9%), radial-gradient(circle at 72% 65%, #f9a8d4 0 8%, transparent 9%), #fff1f2; }
  .export-modal {
    position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
    padding: 24px; background: rgba(0, 0, 0, 0.72);
  }
  .export-modal.hidden { display: none; }
  .export-dialog {
    width: min(920px, 96vw); max-height: 94vh; overflow: auto; padding: 20px;
    border: 1px solid #444; border-radius: 12px; background: #202020;
    box-shadow: 0 24px 80px rgba(0,0,0,0.65);
  }
  .export-dialog-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .export-dialog-header h2 { flex: 1; font-size: 18px; color: #fff; }
  .export-close { border: 0; background: transparent; color: #aaa; font-size: 24px; cursor: pointer; }
  .export-close:hover { color: #fff; }
  .export-preview-wrap {
    display: grid; place-items: center; padding: 24px; border-radius: 8px;
    background-color: #353535;
    background-image: linear-gradient(45deg, #3d3d3d 25%, transparent 25%), linear-gradient(-45deg, #3d3d3d 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #3d3d3d 75%), linear-gradient(-45deg, transparent 75%, #3d3d3d 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  }
  #export-preview-image { display: block; width: 100%; height: auto; box-shadow: 0 8px 28px rgba(0,0,0,0.45); }
  .export-note { margin-top: 12px; color: #aaa; font-size: 12px; }
  .share-link-panel { margin-top: 14px; padding: 12px; border: 1px solid #444; border-radius: 8px; background: #181818; }
  .share-link-panel label { margin: 0 0 7px; color: #fff; font-weight: 600; }
  .share-link-row { display: flex; gap: 8px; }
  .share-link-row input { flex: 1; min-width: 0; margin: 0; }
  .share-copy { flex: none; padding: 7px 14px; border: 0; border-radius: 5px; background: #2563eb; color: #fff; cursor: pointer; }
  .share-copy:disabled { opacity: 0.5; cursor: not-allowed; }
  .share-hint, .share-status { margin-top: 7px; color: #aaa; font-size: 11px; }
  .share-status { min-height: 1em; color: #4ade80; }
  .share-status.error { color: #f87171; }
  .export-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .export-cancel { padding: 8px 16px; border: 1px solid #555; border-radius: 6px; background: #2b2b2b; color: #ddd; cursor: pointer; }
  .shared-card-page { display: none; flex: 1; min-height: 100vh; padding: 32px 20px; background: #111827; }
  body.shared-card-view { height: auto; min-height: 100vh; }
  body.shared-card-view > header, body.shared-card-view > .main, body.shared-card-view > .export-modal { display: none !important; }
  body.shared-card-view > .shared-card-page { display: flex; align-items: center; justify-content: center; }
  .shared-card-content { width: min(960px, 100%); text-align: center; }
  .shared-card-content h1 { margin-bottom: 8px; color: #fff; font-size: 24px; }
  .shared-card-content p { margin-bottom: 22px; color: #9ca3af; }
  .shared-card-image { display: block; width: 100%; height: auto; border-radius: 8px; box-shadow: 0 24px 70px rgba(0,0,0,0.55); }
  .shared-card-actions { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
  .shared-card-download {
    display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px;
    border: 0; border-radius: 6px; background: #16a34a; color: #fff; font: inherit; text-decoration: none; cursor: pointer;
  }
  .shared-card-photo-save { background: #2563eb; }
  .shared-card-save-hint { min-height: 1.5em; margin: 10px 0 0 !important; font-size: 12px; }

  @media (max-width: 720px) {
    body:not(.shared-card-view) { height: auto; min-height: 100vh; }
    body.shared-card-view { width: 100%; min-height: 100dvh; overflow-x: hidden; }
    body.shared-card-view > .shared-card-page {
      width: 100%; min-height: 100dvh; padding: 20px 12px max(20px, env(safe-area-inset-bottom));
      align-items: flex-start;
    }
    .shared-card-content { width: 100%; }
    .shared-card-content h1 { margin-top: 4px; font-size: 20px; }
    .shared-card-content p { margin-bottom: 16px; font-size: 13px; line-height: 1.6; }
    .shared-card-image {
      width: 100%; max-width: 100%; height: auto; border-radius: 6px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    }
    .shared-card-actions { flex-direction: column; margin-top: 20px; }
    .shared-card-download {
      width: 100%; min-height: 48px;
      align-items: center; justify-content: center; font-weight: 600;
    }
    header { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
    header h1 { flex: 1; font-size: 15px; }
    header .badge, header .spacer { display: none; }
    header .draft-actions { order: 3; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); }
    header .draft-btn { min-height: 44px; padding: 8px 6px; }
    header .draft-status { order: 4; width: 100%; }
    button.export-btn { min-height: 44px; padding: 10px 14px; }

    .main { flex: none; flex-direction: column; overflow: visible; }
    .canvas-area {
      order: 1; flex: none; width: 100%; height: min(68vw, 330px); min-height: 240px;
      border-bottom: 1px solid #333;
    }
    .panel { order: 2; width: 100%; overflow: visible; border-right: 0; }
    .panel-section { padding: 16px; }
    .element-list, .properties { padding: 16px; }

    input[type="text"], input[type="number"], select,
    button.add-btn, .template-btn, .background-design-btn, .element-item {
      min-height: 44px;
    }
    input[type="text"], input[type="number"], select { padding: 10px; font-size: 16px; }
    input[type="color"] { height: 44px; }
    .question-option { min-height: 44px; padding: 10px; align-items: center; }
    .question-option input { width: 18px; height: 18px; margin-top: 0; }
    .element-item .del-btn { min-width: 44px; min-height: 44px; font-size: 18px; }
    .zoom-hint { right: 8px; bottom: 6px; font-size: 10px; }

    .export-modal { padding: 8px; }
    .export-dialog { width: 100%; max-height: calc(100dvh - 16px); padding: 14px; }
    .export-preview-wrap { padding: 10px; }
    .share-link-row, .export-actions { flex-direction: column; }
    .share-copy, .export-actions button { width: 100%; min-height: 44px; }
  }
</style>
</head>
<body>

<header>
  <h1>名刺ジェネレーター</h1>
  <span id="font-badge" class="badge">canvasモード（フォント不要）</span>
  <div class="draft-actions">
    <button type="button" class="draft-btn" onclick="saveTemporaryDraft()">一時保存</button>
    <button type="button" class="draft-btn" onclick="restoreTemporaryDraft()">復元</button>
    <button type="button" class="draft-btn" onclick="clearEditorContent()">内容をクリア</button>
  </div>
  <span class="draft-status" id="draft-status" aria-live="polite"></span>
  <div class="spacer"></div>
  <button class="export-btn green" onclick="openImageExport()">エクスポート</button>
</header>

<div class="main">
  <div class="panel">
    <!-- テンプレート -->
    <div class="panel-section">
      <h2>テンプレート</h2>
      <div class="template-grid">
        <button class="template-btn selected" data-grade-mode="lower" onclick="applyTemplate('lower')">小学校 低学年</button>
        <button class="template-btn" data-grade-mode="middle" onclick="applyTemplate('middle')">小学校 中学年</button>
        <button class="template-btn" data-grade-mode="upper" onclick="applyTemplate('upper')">小学校 高学年</button>
      </div>
    </div>

    <!-- プロフィール入力 -->
    <div class="panel-section">
      <h2>プロフィール入力</h2>
      <label for="name-input"><span id="name-label-text">なまえ</span><span class="required-mark">必須</span></label>
      <input type="text" id="name-input" required aria-required="true" placeholder="例：やまだ たろう" oninput="updateNameFromInput(this.value)">
      <label for="dream-input"><span id="dream-label-text">しょうらいのゆめ</span><span class="required-mark">必須</span></label>
      <input type="text" id="dream-input" required aria-required="true" placeholder="例：おいしゃさん" oninput="updateDreamFromInput(this.value)">
      <label for="message-input"><span id="message-label-text">ひとこと</span><span class="required-mark">必須</span></label>
      <input type="text" id="message-input" required aria-required="true" placeholder="例：よろしくね" oninput="updateMessageFromInput(this.value)">
      <label>追加する質問<span class="required-mark">4つ選択</span></label>
      <div id="question-picker" class="question-picker" tabindex="-1"></div>
      <div id="question-count" class="question-count" aria-live="polite"></div>
      <div id="question-answers" class="question-answers"></div>
    </div>

    <!-- フォント -->
    <div class="panel-section">
      <h2>フォント</h2>
      <label for="font-select">文字の種類</label>
      <select id="font-select" onchange="applyFontSelection(this.value)">
        <option value="gothic">ゴシック</option>
        <option value="rounded">まる文字</option>
        <option value="mincho">明朝</option>
      </select>
    </div>

    <!-- カード設定 -->
    <div class="panel-section">
      <h2>カード設定</h2>
      <label>背景デザイン</label>
      <div class="background-design-grid" id="background-design-grid">
        <button type="button" class="background-design-btn selected" data-design="plain" onclick="applyBackgroundDesign('plain')"><span class="background-preview plain"></span>無柄・色のみ</button>
        <button type="button" class="background-design-btn" data-design="sky" onclick="applyBackgroundDesign('sky')"><span class="background-preview sky"></span>空</button>
        <button type="button" class="background-design-btn" data-design="cool" onclick="applyBackgroundDesign('cool')"><span class="background-preview cool"></span>クール</button>
        <button type="button" class="background-design-btn" data-design="cute" onclick="applyBackgroundDesign('cute')"><span class="background-preview cute"></span>かわいい</button>
      </div>
      <label>サイズ</label>
      <select id="card-size" onchange="onCardSizeChange()">
        <option value="91x55">標準 91×55mm</option>
        <option value="89x51">欧米 89×51mm</option>
        <option value="custom">カスタム</option>
      </select>
      <div id="custom-size" style="display:none">
        <div class="row2" style="margin-top:8px">
          <div><label>幅(mm)</label><input type="number" id="card-w" value="91" min="10" max="200" oninput="renderCanvas()"></div>
          <div><label>高さ(mm)</label><input type="number" id="card-h" value="55" min="10" max="200" oninput="renderCanvas()"></div>
        </div>
      </div>
      <label>ベースの厚み(mm)</label>
      <input type="number" id="base-thickness" value="0.8" min="0.2" max="5" step="0.1" oninput="scheduleAutoSave()">
      <label>ベースの色</label>
      <input type="color" id="base-color" value="#ffffff" oninput="renderCanvas()">
    </div>

    <!-- 要素リスト -->
    <div class="element-list">
      <h2>要素</h2>
      <div id="element-list-container"></div>
    </div>

    <!-- 選択要素プロパティ -->
    <div class="properties hidden" id="properties-panel">
      <div class="properties-header">
        <h2>プロパティ</h2>
        <button class="properties-close" onclick="closeProperties()" title="閉じる">×</button>
      </div>
      <label id="prop-text-label">テキスト</label>
      <input type="text" id="prop-text" oninput="updateSelectedProp('text', this.value)">
      <label id="prop-size-label">サイズ (pt)</label>
      <input type="number" id="prop-size" value="12" min="4" max="120" oninput="updateSelectedProp('size', +this.value)">
      <label id="prop-bold-label">スタイル</label>
      <select id="prop-bold" onchange="updateSelectedProp('bold', this.value === 'true')">
        <option value="true">太字</option>
        <option value="false">標準</option>
      </select>
      <label>色</label>
      <input type="color" id="prop-color" oninput="updateSelectedProp('color', this.value)">
      <label>押し出し高さ (mm)</label>
      <input type="number" id="prop-extrude" value="0.5" min="0.1" max="5" step="0.1" oninput="updateSelectedProp('extrude', +this.value)">
      <div class="row2" style="margin-top:10px">
        <div><label>X (mm)</label><input type="number" id="prop-x" step="0.5" oninput="updateSelectedProp('x', +this.value)"></div>
        <div><label>Y (mm)</label><input type="number" id="prop-y" step="0.5" oninput="updateSelectedProp('y', +this.value)"></div>
      </div>
    </div>
  </div>

  <!-- キャンバスエリア -->
  <div class="canvas-area" id="canvas-area">
    <canvas id="namecard-canvas"></canvas>
    <div class="zoom-hint">ホイール: ズーム　ドラッグ(空白): パン　ダブルクリック: リセット</div>
  </div>
</div>

<div class="export-modal hidden" id="export-modal" role="dialog" aria-modal="true" aria-labelledby="export-title" onclick="onExportModalBackdrop(event)">
  <div class="export-dialog">
    <div class="export-dialog-header">
      <h2 id="export-title">完成した名刺</h2>
      <button class="export-close" type="button" onclick="closeImageExport()" aria-label="閉じる">×</button>
    </div>
    <div class="export-preview-wrap">
      <img id="export-preview-image" alt="完成した名刺のプレビュー">
    </div>
    <p class="export-note">内容を確認し、「画像を保存」からPNG形式で保存できます。</p>
    <div class="share-link-panel">
      <label for="export-share-link">共有リンク</label>
      <div class="share-link-row">
        <input type="text" id="export-share-link" readonly onclick="this.select()" aria-describedby="share-link-hint share-link-status">
        <button type="button" class="share-copy" id="share-copy-button" onclick="copyShareLink()">リンクをコピー</button>
      </div>
      <p class="share-hint" id="share-link-hint">名刺データを保存し、短いIDで開くリンクです。このリンクを知っている人だけが名刺を閲覧できます。</p>
      <p class="share-status" id="share-link-status" aria-live="polite"></p>
    </div>
    <div class="export-actions">
      <button type="button" class="export-cancel" onclick="closeImageExport()">編集に戻る</button>
      <button type="button" class="export-btn" onclick="saveExportedCardToPhotos()">写真フォルダに保存</button>
      <button type="button" class="export-btn green" onclick="downloadCardImage()">画像を保存（PNG）</button>
    </div>

function applyViewTransform() {

}

function centerView() {
  const aw = canvasArea.clientWidth, ah = canvasArea.clientHeight;
  if (window.matchMedia('(max-width: 720px)').matches) {

    const fitWidth = Math.max(1, aw - padding) / (cardW * PREVIEW_SCALE);
    const fitHeight = Math.max(1, ah - padding) / (cardH * PREVIEW_SCALE);
    viewZoom = Math.max(0.2, Math.min(1, fitWidth, fitHeight));
  }
  viewPanX = (aw - cardW * PREVIEW_SCALE * viewZoom) / 2;
  viewPanY = (ah - cardH * PREVIEW_SCALE * viewZoom) / 2;
  applyViewTransform();
}

function clientToMM(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / (PREVIEW_SCALE * viewZoom),
    y: (clientY - rect.top)  / (PREVIEW_SCALE * viewZoom),
  };
}

    const message = createMessageElement();

    else elements.push(message);

      const question = elements.find(el => el.role === 'profile-question' && el.questionKey === key);
      if (question) question.y = 34 + index * 5.2;

function getDreamArt(text) {
  const normalized = String(text || '').toLowerCase();
  return DREAM_ART_LIBRARY.find(art => art.keywords.some(keyword => normalized.includes(keyword.toLowerCase()))) || DEFAULT_DREAM_ART;
}

function dreamArtPixels(art) {
  return art.pattern.flatMap((row, y) =>
    [...row].flatMap((cell, x) => art.palette[cell] ? [{ x, y, color: art.palette[cell] }] : [])
  );
}

function createDreamIllustrationElement(dreamText) {
  const art = getDreamArt(dreamText);
  const gridW = Math.max(...art.pattern.map(row => row.length));
  return {
    id: uid(), role: 'dream-illustration', type: 'image', text: art.label,
    x: Math.max(2, cardW - 18), y: Math.max(2, cardH - 18), size: 14,
    gridW, gridH: art.pattern.length, pixels: dreamArtPixels(art), vectorGroups: [],
    bold: true, color: Object.values(art.palette)[0], extrude: 0.4,
  };
}

  const dream = elements.find(el => el.role === 'dream');
  const current = elements.find(el => el.role === 'dream-illustration');
  if (!dream) return;
  const next = createDreamIllustrationElement(dream.text);
  if (current) Object.assign(current, next, { id: current.id, x: current.x, y: current.y });

}

  return String(text || '').replace(/^(?:しょうらいのゆめ|しょうらいの夢|将来の夢)[：:]\s*/, '');
}

  return String(text || '').replace(/^(?:なまえ|名前)[：:]\s*/, '');
}

function messageAnswer(text) {
  return String(text || '').replace(/^(?:ひとこと|一言)[：:]\s*/, '');
}

function questionDefinition(key) {
  return PROFILE_QUESTIONS.find(question => question.key === key);
}

function syncQuestionElements() {
  const existing = new Map(elements.filter(el => el.role === 'profile-question').map(el => [el.questionKey, el]));
  const illustration = elements.find(el => el.role === 'dream-illustration');
  elements = elements.filter(el => el.role !== 'profile-question' && el.role !== 'dream-illustration');

  selectedQuestionKeys.forEach((key, index) => {
    const question = questionDefinition(key);
    if (!question) return;
    const previous = existing.get(key);
    elements.push({
      id: previous?.id || uid(), role: 'profile-question', questionKey: key, type: 'text',
      text: `${questionLabel(question)}：${questionAnswers[key] || ''}`,
      x: previous?.x ?? 6, y: previous?.y ?? 34 + index * 5.2,
      size: previous?.size ?? 5, bold: previous?.bold ?? true,
      color: previous?.color || '#444444', extrude: previous?.extrude ?? 0.3,
    });
  });

  if (illustration) elements.push(illustration);
  if (selectedId && !elements.some(el => el.id === selectedId)) {
    selectedId = null;
    document.getElementById('properties-panel').classList.add('hidden');
  }
}

  const picker = document.getElementById('question-picker');
  const answers = document.getElementById('question-answers');
  const status = document.getElementById('question-count');
  const profileActive = elements.some(el => el.role === 'dream');
  picker.innerHTML = '';
  answers.innerHTML = '';

  for (const question of PROFILE_QUESTIONS) {
    const checked = selectedQuestionKeys.includes(question.key);
    const option = document.createElement('label');
    option.className = 'question-option';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = checked;
    checkbox.disabled = !profileActive || (!checked && selectedQuestionKeys.length >= REQUIRED_QUESTION_COUNT);
    checkbox.addEventListener('change', () => toggleProfileQuestion(question.key, checkbox.checked));
    const text = document.createElement('span');
    text.textContent = questionLabel(question);
    option.append(checkbox, text);
    picker.appendChild(option);
  }

  for (const key of selectedQuestionKeys) {
    const question = questionDefinition(key);
    if (!question) continue;
    const label = document.createElement('label');
    label.htmlFor = `question-answer-${key}`;
    label.innerHTML = `${escHtml(questionLabel(question))}<span class="required-mark">必須</span>`;
    const input = document.createElement('input');
    input.type = 'text';
    input.id = `question-answer-${key}`;
    input.required = true;
    input.disabled = !profileActive;
    input.placeholder = currentGradeMode().answerPlaceholder;
    input.value = questionAnswers[key] || '';
    input.addEventListener('input', () => updateQuestionAnswer(key, input.value));
    answers.append(label, input);
  }

  const count = selectedQuestionKeys.length;
  status.textContent = profileActive ? `${count} / ${REQUIRED_QUESTION_COUNT} 問を選択中` : '子供向けテンプレートで使用できます';
  status.className = 'question-count' + (count === REQUIRED_QUESTION_COUNT ? ' complete' : '');
}

function toggleProfileQuestion(key, checked) {
  if (checked && !selectedQuestionKeys.includes(key) && selectedQuestionKeys.length < REQUIRED_QUESTION_COUNT) {
    selectedQuestionKeys.push(key);
  } else if (!checked) {
    selectedQuestionKeys = selectedQuestionKeys.filter(selected => selected !== key);
    delete questionAnswers[key];
  }
  syncQuestionElements();
  renderQuestionPicker();
  renderElementList();
  renderCanvas();
}

function updateQuestionAnswer(key, value) {
  questionAnswers[key] = value;
  const input = document.getElementById(`question-answer-${key}`);
  if (input) input.setCustomValidity('');
  const question = questionDefinition(key);
  const element = elements.find(el => el.role === 'profile-question' && el.questionKey === key);
  if (question && element) element.text = `${questionLabel(question)}：${value}`;
  if (selectedId === element?.id) document.getElementById('prop-text').value = element.text;
  renderElementList();
  renderCanvas();
}

function validateRequiredProfile() {
  const fields = [
    { role: 'name', inputId: 'name-input', label: '名前' },
    { role: 'dream', inputId: 'dream-input', label: '将来の夢' },
    { role: 'message', inputId: 'message-input', label: '一言' },
  ];
  for (const field of fields) {
    if (!elements.some(el => el.role === field.role)) continue;
    const input = document.getElementById(field.inputId);
    input.setCustomValidity(input.value.trim() ? '' : `${field.label}を入力してください。`);
    if (!input.reportValidity()) return false;
  }
  if (!elements.some(el => el.role === 'dream')) return true;
  if (selectedQuestionKeys.length !== REQUIRED_QUESTION_COUNT) {
    const status = document.getElementById('question-count');
    status.textContent = `追加する質問を${REQUIRED_QUESTION_COUNT}つ選んでください。`;
    status.className = 'question-count error';
    document.getElementById('question-picker').focus();
    return false;
  }
  for (const key of selectedQuestionKeys) {
    const question = questionDefinition(key);
    const input = document.getElementById(`question-answer-${key}`);
    input.setCustomValidity(input.value.trim() ? '' : `${questionLabel(question)}の回答を入力してください。`);
    if (!input.reportValidity()) return false;
  }
  return true;
}

// ============================================================
// ブラウザ内の一時保存
// ============================================================
const DRAFT_STORAGE_KEY = 'namecard-generator:draft:v1';
let autoSaveEnabled = false;
let autoSaveTimer = null;

function setDraftStatus(message, type = '') {
  const status = document.getElementById('draft-status');
  status.textContent = message;
  status.className = `draft-status${type ? ` ${type}` : ''}`;
}

function createDraftSnapshot() {
  return {
    version: 1,
    savedAt: new Date().toISOString(),
    elements: elements.map(({ sourceImage, ...element }) => element),
    selectedQuestionKeys,
    questionAnswers,
    backgroundDesign,
    selectedFontKey,
    gradeMode,
    cardSize: document.getElementById('card-size').value,
    cardW: +document.getElementById('card-w').value || cardW,
    cardH: +document.getElementById('card-h').value || cardH,
    baseColor: document.getElementById('base-color').value,
    baseThickness: document.getElementById('base-thickness').value,
  };
}

function persistDraft(showStatus = false) {
  try {
    const draft = createDraftSnapshot();
    localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(draft));
    if (showStatus) {
      const savedTime = new Date(draft.savedAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
      setDraftStatus(`${savedTime} に保存しました`, 'ok');
    }
    return true;
  } catch (error) {
    console.error(error);
    setDraftStatus('保存できませんでした', 'error');
    return false;
  }
}

function saveTemporaryDraft() {
  persistDraft(true);
}

function scheduleAutoSave() {
  if (!autoSaveEnabled) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => persistDraft(false), 300);
}

function restoreTemporaryDraft({ automatic = false } = {}) {
  try {
    const stored = localStorage.getItem(DRAFT_STORAGE_KEY);
    if (!stored) {
      if (!automatic) setDraftStatus('保存データがありません', 'error');
      return false;
    }
    const draft = JSON.parse(stored);
    if (draft?.version !== 1 || !Array.isArray(draft.elements)) throw new Error('保存データの形式が正しくありません');

    elements = draft.elements.filter(element => element && typeof element === 'object').map(element => ({ ...element, id: element.id || uid() }));
    restorePhotoSourceImages();
    selectedQuestionKeys = Array.isArray(draft.selectedQuestionKeys)
      ? draft.selectedQuestionKeys.filter(key => PROFILE_QUESTIONS.some(question => question.key === key)).slice(0, REQUIRED_QUESTION_COUNT)
      : [];
    questionAnswers = draft.questionAnswers && typeof draft.questionAnswers === 'object' ? { ...draft.questionAnswers } : {};
    backgroundDesign = BACKGROUND_DESIGNS[draft.backgroundDesign] ? draft.backgroundDesign : 'plain';
    selectedFontKey = FONT_OPTIONS[draft.selectedFontKey] ? draft.selectedFontKey : 'gothic';
    gradeMode = GRADE_MODES[draft.gradeMode] ? draft.gradeMode : 'lower';
    ensureMessageElement();
    syncQuestionElements();

    const width = Number(draft.cardW);
    const height = Number(draft.cardH);
    document.getElementById('card-w').value = Number.isFinite(width) && width >= 10 && width <= 200 ? width : 91;
    document.getElementById('card-h').value = Number.isFinite(height) && height >= 10 && height <= 200 ? height : 55;
    const cardSize = ['91x55', '89x51', 'custom'].includes(draft.cardSize) ? draft.cardSize : '91x55';
    document.getElementById('card-size').value = cardSize;
    document.getElementById('custom-size').style.display = cardSize === 'custom' ? '' : 'none';
    if (/^#[0-9a-f]{6}$/i.test(draft.baseColor || '')) document.getElementById('base-color').value = draft.baseColor;
    document.getElementById('base-thickness').value = draft.baseThickness || '0.8';
    document.getElementById('font-select').value = selectedFontKey;
    const badge = document.getElementById('font-badge');
    badge.textContent = currentFontOption().label;
    badge.className = 'badge ok';

    selectedId = null;
    document.getElementById('properties-panel').classList.add('hidden');
    syncGradeModeUI();
    syncNameInput();
    syncDreamInput();
    syncMessageInput();
    syncBackgroundDesignButtons();
    renderQuestionPicker();
    renderElementList();
    renderCanvas(true);
    setDraftStatus(automatic ? '前回の内容を自動復元しました' : '保存内容を復元しました', 'ok');
    return true;
  } catch (error) {
    console.error(error);
    setDraftStatus('保存データを復元できませんでした', 'error');
    return false;
  }
}

function clearEditorContent() {
  if (!confirm('入力内容と保存内容をすべてクリアしますか？')) return;
  clearTimeout(autoSaveTimer);
  localStorage.removeItem(DRAFT_STORAGE_KEY);
  selectedId = null;
  selectedQuestionKeys = [];
  questionAnswers = {};
  backgroundDesign = 'plain';
  selectedFontKey = 'gothic';
  gradeMode = 'lower';
  elements = createKidsElements();
  document.getElementById('properties-panel').classList.add('hidden');
  document.getElementById('card-size').value = '91x55';
  document.getElementById('card-w').value = 91;
  document.getElementById('card-h').value = 55;
  document.getElementById('custom-size').style.display = 'none';
  document.getElementById('base-color').value = '#ffffff';
  document.getElementById('base-thickness').value = '0.8';
  document.getElementById('font-select').value = selectedFontKey;
  document.getElementById('font-badge').textContent = currentFontOption().label;
  syncGradeModeUI();
  syncNameInput();
  syncDreamInput();
  syncMessageInput();
  syncBackgroundDesignButtons();
  renderQuestionPicker();
  renderElementList();
  renderCanvas(true);
  persistDraft(false);
  setDraftStatus('内容をクリアしました', 'ok');
}

function drawBackgroundDesign(targetCtx, scale) {
